drawdrop_diag=0
# DIAG(FX-ORIG,W90): 1 = Effekt-Draws je Zustand (FXKEY/FXSUM mit Occlusion-Pixeln) + neue NV-RenderStates (FXNV), 2 = alle Missions-Draws
fx_diag=0
# DIAG(FX-ORIG,W90): mit fx_diag>=1 Client-Bild in bis zu N Frames mit Effekt-PS (V0+C0)*T0
fx_shots=0
# DIAG(FX-HOLE,W106): fx_shots-Mindestabstand in Frames (0 = 15); mit m3d_census_gate>=2 zaehlen fx_shots nur in der Kampagnen-Mission bei VT online
fx_shot_gap=0
# DIAG(FX-HOLE,W106): mit m3d_census>0 loesen die ersten N fx_shots-Bilder einen Zensus im Folgeframe aus (dazu RTSET-Zeilen je SetRenderTarget)
fx_census=0
per_call=0
syscall_trace=0
# 1 = zweites hlog_init haengt an (cfg-Zeilen bleiben in sb_harness.log), 0 = alt (trunkiert)
hlog_keep=1
# DIAG(STATES): Spielmodus/Szene/Missionsflag bei jeder Aenderung + Heartbeat (A3)
diag_states=0
# DIAG(STATE): kompakte Missions-Zustandszeile 1x/s (A11c, s. state_check.py)
state_diag=0
# DIAG(STATE)-Intervall in ms (<=0 = 1000)
state_every=1000
# DIAG(STARTUP): Start-Minispiel (Balken/Linie/Stufe/Engine, W21-R2)
startup_diag=0
# DIAG(COMBAT): Entity-Tabelle HP/Schaden (W35)
combat_diag=0
# W63 DIAG(CAMPAIGN): Missionsziel-Zaehler/Phase/Ergebnis/Tutorial-Regie (CAMP/CAMPOBJ/CAMPSTEP-Zeilen), 0 = aus
campaign_diag=0
# W141 DIAG(GEAR): Gang-Kette Block-Gang/Out+0xB/Mapper-Latch [0x351518] + eigene Position (GEAR-Zeilen), 0 = aus
gear_diag=0
# W59 DIAG(POLLCENSUS): 48CF0-Aufrufer-Zensus (PCENS-Zeilen: wer fragt welche Taste/Achse ab), 0 = aus
poll_census=0
# WATCHDR (W41): Daten-Watchpoints per Debug-Register DR0-3 (Schreiber finden).
# Bis 4 Specs, Komma-getrennt: ADDR[:len][:w|rw] oder ent:IDX+OFF[:len][:w|rw]
# (Entity-Feld [0x351828]+IDX*0x5C+OFF, zur Laufzeit aufgeloest, bei
# Tabellenwechsel neu bewaffnet). len 1/2/4 (Default absolut 4, ent 2),
# w = nur Schreiben (Default), rw = Lesen+Schreiben. Beispiele:
# watch=0x3563F0:4:w (Missions-Timer) oder watch=ent:67+0:2:w,ent:67+50:2:w
# (Gegner-67 HP/Akku). Log: WATCHDR-Zeilen (EIP, alt/neu, Kette, Frame). Leer = aus.
watch=
# DIAG(NULLCALL): Sprung auf Adresse 0: Aufrufer + Aufruf-Befehl + SEH-Kette,
# jeden eindeutigen Aufrufer einmal (0 = alter generischer VEH-Dump, max 40)
nullcall_diag=1
# DIAG(PHYSALIAS,W86): 1 = Contig-Blockliste (alle MmContig(Ex) Block
# + D3D TexLock neu + PHYSALIAS, Auswertung scripts/physalias_check.py),
# 0 = aus (nur PHYSALIAS, max 16)
contig_diag=0
# Kernel-Semantik (A/B-Schalter, s. BUILD.md):
# fair_cs: 1 = Xbox-CS (Uebergabe an Wartenden, Fix Lade-Hang), 0 = Host-CS
# thread_priorities: 1 = Spiel-Prioritaeten (SetThreadPriority) anwenden (Xbox-Semantik, A5)
# resume_yield_ms: Sleep nach NtResumeThread (Alt-Hack, nötig: A5, 0 = STALL)
[kernel]
fair_cs=1
thread_priorities=1
resume_yield_ms=2
# safe_suspend: 1 = NtSuspendThread laesst kein Ziel suspendiert, das eine
# Host-Sperre haelt (sonst Deadlock wie V_W4a: Lader in ht_alloc), 0 = alt (roh)
safe_suspend=1
# FIX(LOADLOCK,W119): safe_suspend_sync (SuspendThread ist asynchron, das Ziel laeuft evtl.
# noch kurz): 2 = SUSPMARK - Ziel vor dem Suspend markieren, greift es danach noch eine
# Sperre, gibt es sie sofort zurueck (billig); 1 = GetThreadContext nach SuspendThread
# (exakt, aber Mission/Demo -40..50 % Bilder); 0 = alt (ohne)
safe_suspend_sync=2
# DIAG(LOADLOCK,W119): diag_lock_model: 0 = Host-Sperren (hlock) mit atomarem Owner (Fix),
# 1 = ntdll-Nachbildung (Owner nach Erwerb/vor Freigabe getrennt -> SUSPSAFE-Fenster, nur Nachweis)
# diag_lock_inject: >0 = jedes N-te hlock-Erwerb/-Freigabe Sleep(1) im Fenster (Modell 1)
# bzw. in der Sperr-Region (Modell 0), 0 = aus
diag_lock_model=0
diag_lock_inject=0
# LOADLOCK(W119): hlock_spin = Spin-Runden (pause) vor dem Kernel-Wait, wenn eine Host-Sperre
# (hlock) belegt ist; Zaehler je Sperre am Laufende (KRNL LOADLOCK hlock …)
hlock_spin=64
# FIX(PHYSALIAS,W73): 1 = Phys->Virt (Texturdaten/Lock) nimmt zuerst den Contig-Block, der exakt an der Adresse beginnt
# (Low28-Mehrdeutigkeit bei Bloecken > 256 MB; Absturz 0x24E1D3 beim Briefing-Film), 0 = alt (erster Low28-Treffer)
phys_exact=1
# FIX(FILM-WHITE,W177): 1 = Contig-Bloecke (MmAllocateContiguousMemory(Ex)) ohne Low28-Ueberlappung: eigene Contig-Tabelle
# (kein Ring-Ueberlauf), HIGH-Bloecke (> 256 MB) gezielt dort, wo ihr Low28-Bild frei ist, low_alloc-Treffer auf ein
# HIGH-Bild werden stillgelegt -> Phys->Virt eindeutig (Briefing-Film gelegentlich weiss: Filmtextur traf fremden Block).
# Zeile "KRNL CONTIG noalias: ..." am Laufende. 0 = alt
contig_noalias=1
# FIX(SEQ-RENDER,W214): 1 = MmFreeContiguousMemory gibt das Low28-Bild des Blocks wieder frei (Host-Speicher bleibt
# fuer stale Reads). Vorher blieb jedes Bild belegt: je Missions-Load ~40-80 MB, nach einigen Missionen hintereinander
# war das 256-MB-Bild voll, neue Bloecke ueberlappten wieder -> Texturen weiss/fremd. Nur mit contig_noalias=1. 0 = alt
contig_free=1
# FIX(SEQ-RENDER,W214): 1 = freigegebene Contig-Bloecke (contig_free) fuer passende Anforderungen wiederverwenden
# (Laenge exakt bzw. bis 2x, Low28-Bild frei, seit contig_reuse_ms freigegeben) - wie physischer Speicher auf der Xbox.
# Sonst wachsen Adressraum und Commit je Missions-Load (~60 MB) und im Kampf je Effekt (32-Bit-Prozess). 0 = immer neu
contig_reuse=1
contig_reuse_ms=2000
# PERF(PERF-HUD,W122): MmAllocateContiguousMemory(Ex) (low_alloc) sucht freien Platz unter 256 MB ab 0x0F000000
# abwaerts; der Bereich ist ab Missionsbeginn voll (Contig-Bloecke werden nie freigegeben), jede Anforderung lief
# ~3600 VirtualQuery-Schritte (40-75 ms) ins Leere -> FPS-Einbrueche bei Explosionen. 1 = belegte Allokationen am
# Stueck ueberspringen (gleiche Adresse, ~10-15x weniger Abfragen), 2 = Pruefmodus (alte Suche vergleicht, Zeile
# LOWALLOC), 3 = EXPERIMENT Merkpunkt (nicht exakt), 0 = alt.
contig_fast=1
# PERF(FILM-FPS,W123): Xbox-D3D fordert Textur-/Puffer-Speicher mit PAGE_READWRITE|PAGE_WRITECOMBINE (0x404) an; das HLE
# reichte die Bits an VirtualProtect/VirtualAlloc durch -> CPU-LESEN aus diesem Speicher ist ungecacht (~60 ns je Zugriff).
# Bink-Film 512x422: Remaster-Inhalts-Hash (byteweise) + lockwatch-Hash + Upload je Filmbild ~75 ms -> 12 FPS.
# 1 = WRITECOMBINE/NOCACHE beim Host-Mapping weglassen (Inhalt/Adressen gleich, D3D11 kopiert ohnehin), Zeile
# "MEM wc-strip #n" fuer die ersten Faelle; 0 = alt (Bits durchreichen).
mem_wc_strip=1
# FIX(HDRSWAP,W94): 1 = Hybrid-Header an 0x10000: XBE-Header bleibt stehen,
# nur "MZ" (Byte 0-1) + e_lfanew (0x3C, im ungenutzten XBE-Signaturfeld)
# zeigen auf eine Kopie der Loader-PE-Header hinter dem XBE-Header (ohne
# NO_SEH). CreateThread findet gueltige PE-Header, krnl_CreateThread tauscht
# nicht mehr. 0 = alt (XBE<->PE-Tausch je CreateThread: Race, Spiel liest
# Loader-Bytes, z. B. [0x10118]=6 -> Absturz XCalculateSignatureBegin+5).
hdr_hybrid=1
# DIAG(HDRSWAP,W94): >0 = Stress-Thread erzeugt in den ersten N Sekunden
# laufend Leer-Threads per krnl_CreateThread (Race-Reproduktion), 0 = aus
hdr_race_test=0
# (main_sbcore revertiert: A/B ohne Effekt, s. BERICHT W22)
# W22: 1 = redundante Seeks cachen (BGM-Worker-Spin), 0 = alt
seek_cache=1
# W63 FATXSTALE: 1 = Datei nach Ueberschreiben (CREATE_ALWAYS) + Seek hinter das Ende: Luecke mit altem Inhalt fuellen wie FATX (Spielstand-Signatur FUN_000C3A70), 0 = Nullen (alt: Spielstaende komplett genullt)
fatx_stale_extend=1
# W22: 1 = Host-TSC-Frequenz melden (RDTSC/733-Nutzer 1x statt ~4,8x), 0 = alt
tsc_freq=1
# (audio_ring_clip steht unter [audio])
[input]
# A8: 1 = OUTWRITE-Block aktiv (Buttons direkt nach Out[po]), 0 = nur Mapper
# (A/B C/D/F: Mapper schreibt Out[0], 48CF0 liest Out[0]; Out[po]=Out[3] tot)
outwrite=0
# A8: OUTWRITE erst ab Present-Frame N (bisher fest 80000)
outwrite_frame=80000
# A8-Maus: analog (relativ, Mitte 0x7F) + Tasten L/R/M (Haupt/Sub-Waffe,
# Lock-On). Echte Maus nur aktiv, wenn KEIN Replay laeuft (replay= und
# replay_steps= leer); synthetische VKs 320-326 s. docs/BUTTONMAP.md.
mouse_aim=1
mouse_sight=0
mouse_sens=4
mouse_invert_x=0
mouse_invert_y=0
mouse_buttons=1
# A8-DIAG: 1 = SBC/Out/Flags bei Aenderung + Heartbeat (Unit-Log)
input_diag=0
# W79 INPUT-REAL (Spielerbetrieb): Diese Datei ist TESTORIENTIERT (A1-Replay,
# Turbo, Auto-Screenshots). Der Launcher-Start schreibt in user.cfg einen
# Spielerbetrieb-Block (replay_steps=/replay=/movie_skip=0/Turbo aus/...
# + die drei Schalter unten = 1); run_once.ps1 ignoriert user.cfg.
# mouse_capture: 1 = Maus fangen solange das Fenster den Fokus hat (Raw Input,
# Cursor versteckt + aufs Fenster begrenzt, keine Randsaettigung; F10 =
# freigeben/fangen, Fokusverlust gibt frei, Klick faengt wieder), 0 = alt (GetCursorPos)
mouse_capture=1
# input_focus_only: 1 = echte Tastatur/Maus nur bei Fokus des Client-Fensters, 0 = alt (global)
input_focus_only=1
# input_source: 1 = echte Tasten + Maustasten aus Fenster-Nachrichten (WM_KEYDOWN/
# WM_xBUTTONDOWN; wirken nur mit Fokus, Fokusverlust loest alle Tasten), 0 = alt
# (GetAsyncKeyState, global). Launcher-Start schreibt 1
input_source=1
# input_test_hook (nur Tests, realinput.py): 1 = WM_APP+0x7A (Fokus 1/0) und
# WM_APP+0x7B (Mausdelta dx/dy) per PostMessage annehmen - ohne Vordergrund,
# ohne ClipCursor; 0 = aus
input_test_hook=0
# key_toggles: 1 = Tasten 1-5 rasten die 5 Kippschalter der Startsequenz ein/aus
# (bi34 FILT, bi35 OXYGEN, bi36 FUEL, bi37 BUFFER, bi38 VT-LOC; auch Profil-/Pad-
# Bindungen dieser Elemente rasten per Flanke; nur ohne Replay), 0 = alt (momentan, ohne Taste)
key_toggles=1
# W92 key_tap_queue (nur Nachrichtenpfad input_source=1, Tastatur + Maustasten):
# 1 = schnelle Tipper je Taste anstauen (jeder Druck mind. 1 Abfrage an, dazwischen
# mind. 1 Abfrage los, Deckel 8; 3 Tipper zwischen Polls -> 3 Druck/Los-Paare),
# 0 = alt (Tipper zwischen zwei Abfragen verschmelzen zu einem Zustand).
# Launcher-Start schreibt 1
key_tap_queue=1
# W87 toggle_assist (nur mit key_toggles=1): Das Spiel zaehlt in der Schalter-
# phase nur Flanken AUS->AN (schon AN beim Eintritt = Zustand 3 "erst AUS").
# 1 = ein Druck auf einen schon eingerasteten, vom
# Spiel noch nicht erkannten Schalter legt ihn "neu um" (6 Frames AUS, dann AN;
# bleibt eingerastet), 0 = reine Rast (W79)
toggle_assist=1
# W87 mouse_mode: absolute = Fadenkreuz folgt der Maus direkt (Vorsteuerung
# auf die Zielglaettung des Spiels FUN_00034BE0, Maus-Akku mit Bruchteilen;
# nur Missionsschleife mit VT online, nur Achsen aus der Maus; Empfindlichkeit mouse_sens/64
# Hebelstufen je Count, sens 4 = ~400 Counts Mitte->Monitorrand), relative = Zielhebel wie
# bisher (bitgenau). Launcher-Start schreibt die Wahl der Seite Steuerung
# (Standard absolute)
mouse_mode=absolute
# W87 DIAG(AIMSTEP): 1 = Zielkette pro Frame loggen (Hebel -> Soll -> geglaettet
# -> Fadenkreuz), solange der Hebel sich in den letzten 120 Frames aenderte
aim_diag=0
# W87 DIAG(STARTSEQ)-Bilder (braucht input_diag=1): 1 = Client-Bild bei jedem
# Startsequenz-Wechsel + alle 300 Frames bis VT online, 0 = aus
startseq_shots=0
# W75: 1 = Original-Controller lesen (USB-Geraet bzw. sbc_fixture unten),
# LEDs via SetState-Hook (ohne Geraet nur Log); 0 = Tastatur/Maus (Default)
sbc_usb=0
# W75: Fixture-Datei mit Reports statt USB-Geraet (nur mit sbc_usb=1),
# z. B. harness/fixtures/sbc/mission-start.sbc; leer = Geraet oeffnen
sbc_fixture=
# W128: Original-Controller gegen Maus (nur mit sbc_usb=1 wirksam).
# sbc_mouse_off: 1 = Maus-Achsen aus, solange der Controller aktiv ist (Geraet
# offen/Fixture), 0 = beide parallel per Arbitrierung (sbc_axis_arb)
sbc_mouse_off=1
# sbc_mouse_buttons: mit sbc_mouse_off=1: 1 = Maustasten bleiben, 0 = auch aus
sbc_mouse_buttons=1
# sbc_axis_arb: 1 = je Achse gewinnt das zuletzt aktive Geraet (Hebel bewegt
# > sbc_arb_dead Einheiten -> Controller; Maus bewegt >= sbc_mouse_wake
# Hebelstufen -> Maus), 0 = alt W75 (USB nur bei neutraler Achse)
sbc_axis_arb=1
sbc_arb_dead=8
sbc_mouse_wake=3
# W128: 1 = Ruhelage beim Start erfassen (erste ruhige 24 Polls): Mitte der
# Hebel = Ruhe (+-sbc_axis_dead), Pedal-Null = Ruhe (+sbc_pedal_dead);
# sbc_cal_<achse> unten gewinnt. 0 = roh wie das Original. Nur sbc_usb=1.
sbc_cal=1
sbc_axis_dead=6
sbc_pedal_dead=16
# W128: Kalibrierung Original-Controller (nur mit sbc_usb=1; ungesetzt =
# Rohwerte, bitgleich). Werte = High-Byte der Achse. Vorschlagszeilen liefert
# sbc_probe --test (Ergebnisdatei), Eintrag in user.cfg [input], z. B.:
#   sbc_cal_aim_x=3,128,253     lo,mitte,hi (aim_x/aim_y 0..255, rot/sight_x/sight_y -128..127)
#   sbc_cal_pedal_m=28,253      lo(Ruhe),hi (pedal_l/pedal_m/pedal_r 0..255)
#   sbc_dead_pedal_m=3          Totzone um die Mitte bzw. ueber lo (0..100)
#   sbc_gear_map=7,8,9,10,11,12,13  Rohwerte Gang-Byte fuer R,N,1..5 (falls != 7..13)
# W76 CTRL-MAP: Eingabe-Profil (profiles/<name>.ini, s. docs/EINGABE.md);
# leer = fest verdrahtete Legacy-Belegung (bitgenau, Default)
input_profile=
# W67/A9 entfernt: menubg_diag, titlebg_diag, auto_start_frame
# W14: 1 = Briefing-Film per 'L' ueberspringen (schneller Testpfad, 3x 'L' (bi2)
# nach Filmerkennung); run_once.ps1 setzt das fuer Testlaeufe (-film = Opt-out)
# W63: 2 = zusaetzlich jeden spaeteren Film (opj.bik nach M1, bri01.bik vor M2 ...)
movie_skip=0
# W63: aimat-Ziel-Bot (Testpfad) mit Anti-Windup des Schirmreglers (Fadenkreuz ausserhalb -> Korrektur abbauen, Feinkorrektur max. 60 px), 0 = alt (W59)
aimat_antiwindup=1
# A1-Standard (schnell + zustandsgesteuert, ~45 s bis Briefing-Film):
# replay_steps mit Modus-Anker (Schritt 2 wartet auf Spielmodus 3 =
# Menue-Logik, u32 0x2EEA34) und Turbo bis Modus 4 (turbo_until_mode).
# 100 Schritte = 101 Tasten des alten replay= minus 4000:SPACE (nutzlos,
# s. BERICHT_M2.md W1). Trigger: f+N | file:NAME[+N] |
# mem:0xADDR=0xVAL[+N] (s. BUILD.md).
replay_steps=
# FALLBACK (altes Verhalten, ~7 min bis Film): replay_steps= leeren,
# turbo_until_mode=0 setzen und folgende Zeile als replay= einkleben:
#OLDREPLAY=500:73,20;4000:32,60;7000:32,60;9000:13,60;10000:13,60;11000:13,60;12000:13,60;7500:32,60;7900:32,5;8300:32,60;9200:32,60;9800:32,60;10400:32,60;11000:32,60;11800:32,60;13000:32,90;14000:32,90;15000:283,90;16000:32,90;17000:32,90;18000:283,90;19200:40,20;19400:32,60;19600:39,20;20000:40,20;20200:283,60;20400:39,20;20800:40,20;21000:32,60;21200:39,20;21600:40,20;21800:283,60;22000:39,20;22400:40,20;22600:32,60;22800:39,20;23200:40,20;23400:283,60;23600:39,20;24000:40,20;24200:32,60;24400:39,20;24800:40,20;25000:283,60;25200:39,20;25600:40,20;25800:32,60;26000:39,20;26400:40,20;26600:283,60;26800:39,20;27200:40,20;27400:32,60;27600:39,20;30000:32,90;31000:32,90;32000:32,90;33000:32,90;34000:32,90;35000:32,90;36000:32,90;37000:32,90;38000:32,90;39000:32,90;30000:37,200;31000:32,60;32000:39,200;33000:32,60;34000:38,200;35000:32,60;40000:274,60;41000:272,60;44000:37,200;45000:32,60;46000:39,200;47000:32,60;48000:90,60;49000:32,120;50000:37,200;51000:39,200;52000:32,120;55000:13,120;57000:13,120;59000:13,120;58000:90,60;59000:32,120;60000:32,60;60500:32,60;61000:32,60;62000:32,60;63000:32,60;64000:32,60;65000:32,60;66000:32,60;67000:32,60;68000:32,60;69000:32,60;70000:32,60;77000:32,60;78000:32,60;79000:32,60
replay=
# Capture: JPG bei Frame N, dann alle M Frames (Turbo: mehr Frames)
[capture]
screenshot_frame=0
screenshot_every=0
# W67/A9 entfernt: diag_frame
# 1 = JPG (~0,4 MB), 0 = BMP (~11 MB); Ziel: <out>/shots/
screenshot_jpg=1
# Audio-HLE (A7): 1 = DirectSound-HLE (Mixer + Live-Ton), 0 = stumm (alt)
# audio_capture: 1 = gemischten Ausgang als <out>/audio.wav schreiben
[audio]
audio=1
audio_capture=0
# NULLCALL (W13): HRTF-Funktionszeiger vorbelegen (wie DirectSoundUseFullHRTF),
# sonst Voice-Commit-Sprung nach 0 (~200x/Mission). 0 = aus (alt)
hrtf_ptr=0
audio_live=1
audio_pan=1
audio_freq=1
audio_buflen=1
# W22: 1 = SetBufferData setzt buflen (Bink-Ring statt Lazy-64K), 0 = alt
audio_setbuf_len=1
# W22: 1 = Unlock nur ab Ring-Frontier appenden (Bink-Ueberlapp nicht doppelt), 0 = alt (6 % Ueberlauf)
audio_ring_clip=1
# W34: 1 = Process async (PENDING + Echtzeit-Vollzug, Xbox; Lade-Pause <1 s), 0 = alt (sync + Sleep(10)x50 -> 5,1-s-Timeout pro Laden)
audio_process_async=1
# W83: 1 = Ring-Ueberlapp: spaetere Schreibung ersetzt noch nicht gespielte
# FIFO-Frames (Xbox-Ring; Bink gibt am Ringende den unbeschriebenen Wrap-Teil
# frei und schreibt ihn erst im naechsten Lock -> sonst alle 0,6 s 10-60 ms Ton
# einer Ringrunde zuvor = Film-Stottern), 0 = alt (Clip: erste Schreibung gewinnt)
audio_ring_overwrite=1
# W83: DIAG(BINKWRAP) Wrap-Unlocks (Lock-Puffer vs. Spielspeicher), 0 = aus
audio_wrap_diag=0
# W89: 1 = Puffer-Stop/GetStatus an den I-Wrappern (0x21F53C/0x21F598) hooken.
# Diese rufen die C-Ebene mit this-0x1C -> HLE erkannte die Stimme nie: Stop
# wirkungslos, GetStatus immer STOPPED -> Spiel hielt jede SFX-Stimme fuer frei
# und klaute sie sofort neu (Schuesse/Effekte nach Millisekunden abgeschnitten).
# 0 = alt
audio_ithis_fix=1
# W89: 1 = SetLoopRegion legt nur die Region fest (geloopt wird nur mit
# Play(DSBPLAY_LOOPING), Xbox-Semantik); Region/Position in Frames der auf
# 44100 resampelten Daten; Einmal-Ton spielt bis Datenende. Das Spiel setzt die
# Region bei JEDEM Ton -> alt loopten Schuesse/Treffer ewig (und 11-kHz-Toene
# nur ihr erstes Viertel). 0 = alt
audio_loop_fix=1
# W89: 1 = SetPitch-Klemme -98304..32767 (Spiel nutzt -8576 = 11,3 kHz;
# alt -8192 = 12 kHz spielte 11-kHz-Toene bis 19 % zu hoch), 0 = alt
audio_pitch_range=1
# W89: 1 = ADPCM-Resampling (z. B. 11025 -> 44100) linear interpoliert,
# 0 = alt (naechster Nachbar = Treppe, metallischer Klang)
audio_adpcm_lerp=1
# W89: 1 = DS3D: Distanzdaempfung (DirectSound-Modell: (min/min(d,max))^rolloff,
# Spiel: Min 35/Max 200/Rolloff 1,3) + Links/Rechts-Balance aus der Richtung
# zum Listener, nur fuer vom Spiel positionierte Stimmen (Bink/2D unberuehrt).
# 0 = alt (3D-Setter ignoriert: jede Quelle voll und mittig = Drone/Clipping)
audio_3d=1
# W89: DIAG(SFX) Ereignis-Spur der Puffer-Stimmen (ohne Bink), Wert = max. Zeilen, 0 = aus
audio_sfx_diag=0
# W95: 1 = Einmal-Toene (Play ohne LOOPING) enden am Datenende: der Mixer wrappt
# die Loop-Region nur bei Schleifen (das Spiel setzt die Region bei jedem Ton).
# 0 = alt (jeder Ton mit Loop-Region loopt endlos, Stimmen stauen sich)
audio_oneshot_fix=1
# W95: DIAG(SFXN) einmal pro Sekunde: aktive Puffer-Stimmen (ohne Bink), davon
# Schleifen/stumm, Starts/Enden/Stops, aelteste Stimmen. 0 = aus
audio_voice_diag=0
# W102: 1 = Voice-Filter: SetFilter Mode 1 (DLS2) als resonanter 2-Pol-Tiefpass
# (Chamberlin-SVF wie der MCPX-Voice-Processor; Spiel: Cutoff 30..8000 Hz,
# Resonanz 0..22,5 dB, 0x108530). Tutorial: zwei Dauerschleifen mit Cutoff
# 0x8000 (< 30 Hz = zu) liefen ungefiltert voll (68 % der Missionsenergie).
# 0 = alt (SetFilter ignoriert, alles ungefiltert)
audio_filter=1
# W102: DIAG(LVL) Pegel je Stimme und Sekunde -> <out>/voice_levels.csv,
# DIAG(LVLT) Rangliste (Laufzeit x Pegel) alle 30 s. 0 = aus
audio_level_diag=0
# (seek_cache steht unter [kernel])
# W24: GetCaps-dwSize auf 12 (Xbox-DSOUNDCAPS) klemmen (Fix Missionsende-Nullcall). 0 = alt (fatal)
audio_caps_clamp=1
# Master: 1 = Cockpit-Luke/Zuendung (H/I) als Taster wie am echten Controller, 0 = alt (dauerhaftes Toggle-Bit)
[input]
# W83: 1 = echtes Gamepad bei aktivem Replay ignorieren (wie Tastatur/Maus, M2b),
# 0 = alt (Pad wirkt immer). Standard 0, solange Spielerlaeufe noch mit Replay
# laufen (W79); run_once.ps1 setzt 1 fuer Testlaeufe.
pad_replay_gate=0
# W132: XInput-Gamepad gegen Maus (nur wirksam, wenn die Achse Pad-Quellen
# hat, ein Pad da ist und die Maus liefert; sonst alles wie bisher).
# pad_axis_arb: 1 = je Achse gewinnt das zuletzt aktive Geraet (Stick bewegt
# > pad_arb_dead Einheiten -> Pad; Maus bewegt >= pad_mouse_wake Hebelstufen
# bei ruhendem Stick -> Maus; Digitalachsen wie bisher), 0 = alt (groesste
# Auslenkung gewinnt, s. EINGABE.md)
pad_axis_arb=1
pad_arb_dead=8
pad_mouse_wake=3
# pad_mouse_off: 1 = Maus-Achsen aus, solange ein Gamepad aktiv ist
# (Maustasten bleiben an), 0 = parallel per Arbitrierung
pad_mouse_off=0
# W143: globale Gamepad-Totzonen in % (0..90, 0 = Profilwerte unveraendert);
# wirken als Untergrenze (max mit der Profil-Totzone). Schreibt der
# Controller-Assistent im Launcher (Gamepad-Seite) nach user.cfg.
pad_dz_stick=0
pad_dz_trig=0
# W218 SIMPLE-CONTROLS (vereinfachte Steuerung, nur Maus/Tastatur/Gamepad,
# nie mit aktivem Original-Controller; Standard aus = Original-Steuerung).
# W236 AIM-ASSIST: aim_assist (Zielhilfe, ersetzt W218 aim_turn; Altwert
# aim_turn=1 wird als aim_assist=1 gelesen):
#   0 = Original (Sicht nur ueber den Sichthebel)
#   1 = Fadenkreuz am Rand dreht die Cockpit-Sicht mit
#   2 = Waffenarm fest: Sicht folgt dem Arm (Fadenkreuz in der Mitte),
#       am Sicht-Anschlag bewegt sich nur noch der Arm (Maus-Achsen;
#       Pad/Tasten wie 1)
# aim_assist_edge: Rand fuer Stufe 1 in % der halben Bildbreite/-hoehe.
aim_assist=0
aim_assist_edge=80
# auto_gear: 1 = automatischer Gangwechsel (Gas schaltet nach Geschwindigkeit
# hoch/runter, Bremse im Stand = Rueckwaerts, in R ist die Bremse das Gas).
auto_gear=0
sbc_momentary=1
ign_toggle_fix=1
[audio]
# W67/A9 entfernt: audio_clkdiag
# (W14: audio_fifo_cap wieder entfernt - A/B 4,7 vs. 19,4 FPS, s. BERICHT)
# Watchdog: 1 = bekannte Audio-Poll-Ladepause (Main in FUN_0010d8d0,
# 5,1-s-Timeout, kein Haenger) als LOAD-PAUSE statt STALL melden;
# ab dem 3. Fenster (>=15 s) trotzdem STALL. 0 = alt (jedes Fenster
# ohne Frames = STALL)
[watchdog]
stall_loadpause=1
[remaster]
# W103 REM-FRAME: Remaster-Spur, alles optional. Standard = Original bitgenau.
# Hauptschalter: 0 = Original (alle Remaster-Bereiche aus), 1 = Einzelschalter gelten
remaster=0
# 1 = Ersatz-Texturen <remaster_dir>/textures/x<hd_scale>/<hash>.dds (BC1/3/7, Mips) statt Original;
# fehlt die Datei -> Original; per CPU beschriebene Texturen nie
hd_textures=0
# Paket-Stufe 2 oder 4 (Unterordner textures/x2 bzw. x4). W114: die Freigaben je Variante
# aus <remaster_dir>/selection.json (Bewertung im Board) gelten immer: Stufe 4 -> 4x nicht OK
# nimmt 2x (wenn 2x nicht "nicht OK"), sonst Original; Stufe 2 -> 2x nicht OK = Original.
# Unbewertet/keine Datei = Auto-Pack. Alt 0 (W111 "Auswahl") wirkt wie 4.
hd_scale=4
# Grenze Ersatz-Cache (VRAM) in MB
hd_cache_mb=1024
# W113 REM-TEXT: 1 = manuelle Ersatz-Texturen (Text-Rekonstruktion, scripts/remaster_text.py)
# <remaster_dir>/textures/manual/<hash>.dds (4x; bei Stufe 2 zuerst manual/x2/) haben Vorrang
# vor x2/x4 und vor der Auswahl - ausser der Nutzer hat im Board ausdruecklich "Original" gewaehlt.
# Wirkt nur mit remaster=1 + hd_textures=1. 0 = manual/ ignorieren.
hd_manual=1
# PERF(FILM-FPS,W123): 1 = per CPU beschriebene Texturen (Schreib-Lock: Bink-Film, Textebene) ohne Inhalts-Hash
# hochladen - sie werden nie ersetzt und (ausser dem ersten Dump-Stand) nie gedumpt; der byteweise FNV-64 ueber
# jedes Filmbild war unbenutzt (W123: 55 von 75 ms je Filmbild bei hd_textures=1). 0 = alt (immer hashen).
hd_cpu_nohash=1
# Platzhalter (noch ohne Wirkung): Effekte, Ultrawide-Remaster, Nachbearbeitung
fx_enhanced=0
ultrawide=0
postfx=0
# DIAG(REM-FRAME,W103): 1 = jede neue Textur als PNG + index.json nach <remaster_dir>/dump (Spieldaten: nie committen)
tex_dump=0
# leer = auto (<Repo-Wurzel mit poc-native>/remaster)
remaster_dir=
# W140 PACK-FORMAT: 1 = Ersatz-Texturen aus .sbpack-Paketen (sb_pack.c: packs.json
# + Manifeste beim Start, Index im Speicher, DDS per Offset), 0 = Ordner-Lader (Rueckfall).
# W148 PACK-LAUNCHER: Standard = 1 (Paket-Lader). Ohne packs.json bitgleich zum Original.
pack_loader=1
# Liste aktiver Pakete (JSON, Stufe kommt aus hd_scale); leer = keine Pakete. W148-Standard unten.
# Relativ = zu remaster_dir (z. B. packs/packs.json), absolut = wie angegeben.
pack_list=packs/packs.json
[overlay]
# W118 REM-OVERLAY: ESC oeffnet/schliesst im Spiel ein kompaktes Einstellungs-Overlay (Bildrate, Shading,
# Monitor-Effekte, Bildraender, Maus, HD-Texturen 2x/4x mit B = A/B-Vergleich; "Als Standard speichern" -> user.cfg).
# Solange es offen ist, gehen echte Eingaben ans Overlay, nicht ans Spiel. 1 = an (Spieler-Standard; geschlossen
# zeichnet es nichts, Standardpfad bitgleich), 0 = aus (ESC geht wie bisher durch). ESC ist damit reserviert
# (wie F10): Profil-Bindungen KEY:ESC wirken bei overlay=1 nicht.
overlay=1
# TEST(W118): Skript "<bild>:<aktion>,..." (Bild = Present-Nr., mN = N Bilder nach Missionsbeginn (Modus 4), mK.N = K-te Mission, +N = N nach
# dem vorigen Schritt); Aktionen ESC UP DOWN LEFT RIGHT ENTER SPACE B, Buchstabe/Ziffer, VK<hex>, LCLICK, SHOT
# (shots/ovl_*), FOCUS1/FOCUS0 (mit input_test_hook=1), LOG. Tasten per PostMessage an das EIGENE Fenster
# (fokusneutral). Leer = aus.
overlay_test=
# W188 GAME-MENU: ESC oeffnet zuerst das Spielmenue (Weiter, Einstellungen, Fotomodus (W195), Feedback,
# Beenden mit Rueckfrage); Bedienung Maus/Tastatur/Pad, Einstellungen mit Tab-Zeile (TAB/Umschalt+TAB, Pad LB/RB).
# 0 = ESC direkt in die Einstellungen (W118).
game_menu=1
# W188: 1 = offenes ESC-Menue pausiert das Spiel (Spiel-Thread steht, Ton stumm, Gast-Uhren beim Fortsetzen
# verschoben - kein Zeitsprung); 0 = Spiel laeuft dahinter weiter. Pause-Taste = Profil-Aktion "pause" (Standard PAUSE).
menu_pause=1
# W222 ALPHA-WELCOME: 1 = beim Programmstart einmal der Alpha-Hinweis (Dank, Feedback-Tasten F11/F9 bzw. echte
# Belegung, ESC-Menue, GitHub Issues); das Spiel pausiert, beliebige Taste/Klick/Pad-Taste schliesst. 0 = aus.
# Standard: Community 1, Private/Tests 0 (run_once.ps1 setzt immer 0).
alpha_welcome=1
# Ziel von "Als Standard speichern" (leer = user.cfg neben sb_native.cfg bzw. Umgebung SB_USER_CFG)
overlay_save_path=
[photo]
# W195 PHOTO-MODE: Fotomodus - F12 (Profil-Aktion "photo") oder ESC-Menue -> Fotomodus. Das Spiel pausiert; Panel mit
# Cockpit an/aus (aus = nur das Kamerabild des Hauptmonitors, ohne HUD/Korn), freier Kamera (drehen/fahren, begrenzt),
# Aufnahme-Aufloesung x1/x2/x4/x8 (gekachelt) und PNG/JPG. Cockpit aus / freie Kamera / x2..x8 nur in der Mission mit
# Bildrate 60/120 (Aufzeichnung des Ticks), sonst Cockpit-Bild x1. Im VR-Betrieb aus. 0 = Fotomodus aus.
photo_mode=1
# Fotoordner (absolut); leer = <Nutzerdaten>\Screenshots (Community: %LOCALAPPDATA%\Steelbound\Screenshots,
# Private/Tests: <Ausgabeordner>\Screenshots). Dateiname Steelbound_JJJJ-MM-TT_hh-mm-ss_M<nn>.png
photo_dir=
# Standard-Aufnahmeaufloesung (1, 2, 4, 8 x Fensteraufloesung bzw. x Fensterhoehe ohne Cockpit) und Format (png|jpg)
photo_scale=1
photo_format=png
# Bildformat ohne Cockpit (Standard 1): 0 = Bildschirm (Ausschnitt: Kamerabild deckt das Fenster, oben/unten beschnitten),
# 1 = Bildschirm (weit: mehr Sichtfeld seitlich, was das Spiel dort nicht gezeichnet hat bleibt leer),
# 2 = Kamera (Kamerabild komplett im Seitenverhaeltnis, in dem der Hauptmonitor es zeigt, ~4:3). Nie gestreckt.
photo_aspect=1
# Freie Kamera: Grenzen (Grad links/rechts, Grad hoch/runter, Weg in Spiel-Einheiten ~ m). Das Spiel zeichnet nur, was
# die Spielkamera sieht - groessere Werte zeigen Luecken am Bildrand.
photo_cam_yaw=35
photo_cam_pitch=25
photo_cam_dist=4
[feedback]
# W188 GAME-MENU: Feedback Stufe 1 - GitHub-Repo (Owner/Name) fuer "Neues Issue" aus ESC -> Feedback. Der Client
# legt nur ein Paket unter <nutzerdaten>/feedback/<zeit>/ an und oeffnet Browser/Explorer auf Nutzeraktion.
repo=Greevee-Lab/Steelbound
[overlay]
# W122 PERF-HUD: Leistungs-Overlay (Look wie ESC-Overlay) in einer Bildecke: praesentierte FPS, Spiel-Ticks/s,
# Bildzeit avg/min/max + 1%-Low, Bildzeit-Graph, CPU je Tick (Spiel/Render/Interp), GPU-Zeit (Timestamp-Queries),
# Draws/Tick, Aufloesung/Modus. Taste (perf_hud_key) = an/aus, Shift+Taste = Ecke wechseln; beides wird sofort in
# user.cfg gemerkt (wie "Als Standard speichern"). 0 = aus (Standard; misst und zeichnet nichts, Standardpfad
# bitgleich), 1 = beim Start sichtbar.
perf_hud=0
# Ecke: 0 = oben rechts, 1 = oben links, 2 = unten links, 3 = unten rechts (Rand des ganzen Fensters)
perf_hud_pos=0
# Taste: F1..F12 (F10 = Maus, nicht moeglich), VK<hex>; 0 = keine Taste. Die Taste wird vom Spiel ferngehalten
# (Profil-Bindungen auf dieselbe Taste wirken nicht).
perf_hud_key=F2
# W219 WATERMARK (temporaer, oeffentliche Alpha): kleiner halbtransparenter Text "Steelbound <Version> . ALPHA"
# unten rechts im Bild (4:3-Box, nie in den Balken); Version aus dem Build (make_alpha.py/release.sh), sonst
# "Steelbound dev". Sichtbar auch in Feedback-Screenshots/-Clips, nicht im Fotomodus und nicht in VR.
# 1 = an (Community-Standard), 0 = aus. Entfernen: hier 0 setzen.
watermark=1
# DIAG(PERF-HUD,W122): alle N Sekunden eine Zeile "PERFHUD ..." (Bildzeiten, Tick-Last, CPU-/GPU-Anteile) und
# Einzelzeilen "PERFSPIKE ..." fuer lange Bilder - auch ohne sichtbares Panel. 0 = aus.
perf_log=0
# DIAG(PERF-HUD,W122): PERFSPIKE ab dieser Bildzeit in ms (0 = 2x Zielbildzeit, bei 120 FPS also 16,7 ms)
perf_spike_ms=0
# DIAG(PERF-HUD,W122): 1 = Stichproben-Profiler des Spiel-Threads (Zeilen PERFPROF/PERFPROF2, nur mit perf_log)
perf_prof=0
# DIAG(TICK-PERF,W125): 1 = Zeitmesser um Blockier-Kandidaten des Spiel-Threads (Zeile TICKBLK: blend/visq/ipmap/ipx/rtt/
# clear/swap/lock in ms je Tick, Sichtbarkeitstest End->Get, Puffer-Saetze, verfallene Zwischenbilder; nur mit perf_log)
perf_blk=0
# DIAG(TICK-PERF,W125): N > 0 = jede N-te Zwischenbild-Wiedergabe mit Timestamps je Zielwechsel (Zeile GPUSPLIT: GPU-ms je
# Zielgroesse, Startkopien); synchron ausgewertet (ein GPU-Sync je Messung)
perf_gsplit=0
# DIAG(GPU-COST,W146) perf_gpass=N: jede N-te Zwischenbild-Wiedergabe GPU-Zeit je Pass (asynchrone
# Timestamps, kein GPU-Sync): Zeile GPUPASS je perf_log-Fenster, Panel (F2) zwei Zeilen "Pass ..."
perf_gpass=0
# DIAG(PERF-BENCH,W137): 1 = Bild-/Tick-Spur nach runs/<tag>/perf_trace.csv (P je Present, T je Tick, G je GPU-Messung;
# Zeit = QPC-Sekunden wie boot.log) fuer scripts/perf_bench.py; misst wie perf_log (ohne PERFTHR-Snapshot ausserhalb der Mission)
perf_trace=0

[vr]
# W134 VR-PROTO: Stereo-Cockpit mit Kopf-Tracking aus der Interp-Aufzeichnung (Prototyp, BERICHT W134).
# Aussenwelt bleibt flach als Monitorbild, HUD auf der Monitorflaeche, Cockpit stereo. Braucht interp_fps>0.
# 0 = aus (Standard, kein VR-Code laeuft, bitgleich), 1 = an: OpenXR (Brille) ueber die aktive Runtime
# (eigener Mini-Loader, Standard-OpenXR + XR_KHR_D3D11_enable); fehlt sie oder scheitert ein Schritt:
# eine Log-Zeile "VR: OpenXR nicht verfuegbar (...)", dann Desktop-Vorschau (vr_preview) bzw. VR aus.
vr_enable=0
# Desktop-Vorschau ohne Brille: sbs = beide Augen nebeneinander (je Auge eigenes Seitenverhaeltnis),
# left/right = ein Auge, off = keine Vorschau (Fenster zeigt das normale Bild; nur Brille).
# W159: Standard ein Auge.
vr_preview=left
# OpenXR-Runtime-Manifest (leer = Umgebung XR_RUNTIME_JSON bzw. Registry ActiveRuntime; 32-bit-Prozess liest
# die 32-bit-Runtime). off = OpenXR nicht versuchen. Tests: build/Release/vr_mock_runtime.json (Mock-Runtime).
vr_runtime_json=
# Sitzhoehe-Versatz in mm (+ = Kopf hoeher), Massstab in % (Tracking-Meter -> Spiel-Einheiten),
# Augenabstand in 1/10 mm (nur Vorschau; mit Brille gelten die Augenposen der Runtime).
vr_seat_height=0
vr_world_scale=100
vr_ipd=640
# Vorschau: vertikales Sichtfeld je Auge in Grad (0 = wie die Spielkamera, 45 Grad)
vr_fov=0
# Abstand der Cockpit-/Monitor-Ebene in mm (Spiel-Einheit ~ 1 m; 0 = 800). Die Cockpit-Draws des Spiels sind fast
# orthografisch (keine echte Tiefe, BERICHT W134): sie liegen als Relief um diese Ebene, HUD/2D genau darauf.
vr_monitor_depth=0
# Cockpit-Relief: halbe Tiefenspanne in mm, abgebildet aus der Tiefenordnung (z/w) des Spiels (0 = flach)
vr_relief=150
# Vorschau-Kopfpose: keys = Ziffernblock 4/6 drehen, 8/2 neigen, 5 zentrieren (NumLock an, nur im Fokus), script = Test-Skript (Drehen/Neigen,
# Recentering bei Bild 300), still = fest geradeaus
vr_sim=keys
# Recentering-Taste (F1..F12, VK<hex>); auch ESC-Menue Seite "VR"
vr_recenter_key=F8
# DIAG(VR-PROTO,W134): 1 = Zeile "VR stat" alle 5 s (Bildrate je Auge, Wiedergabe-ms, Draw-Klassen, Kopfpose),
# 2 = zusaetzlich bei vr_shots das exakte Mono-Bild desselben Ticks (vr_<n>_mono, Vergleich Einzelauge/IPD 0)
vr_diag=0
# DIAG(VR-PROTO,W134): alle N VR-Bilder ein Client-Bild shots/vr_<n>_sbs bzw. _auge (max 24; script: + Bild 299/302)
vr_shots=0
