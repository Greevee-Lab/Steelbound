# keyboard_default - heutige feste Belegung (hooks_input.c), exakt.
# Format: s. poc-native/docs/EINGABE.md. Zeilen "element = quelle, ...".
# Quellen: KEY:<name>, MOUSE:LEFT/RIGHT/MIDDLE/X/Y, PAD:... (hier ungenutzt).
# Diese Datei muss dem eingebauten Fallback entsprechen (input_selftest
# prueft Datei == eingebaut); Aenderungen hier wirken sofort (Neustart).

[buttons]
bi0 = KEY:SPACE, MOUSE:LEFT
bi1 = KEY:F, MOUSE:RIGHT
bi2 = KEY:L, MOUSE:MIDDLE
bi4 = KEY:H
bi5 = KEY:I
bi6 = KEY:ENTER
bi8 = KEY:M
bi9 = KEY:TAB
bi11 = KEY:Z
bi12 = KEY:X
bi13 = KEY:V
bi18 = KEY:C
bi20 = KEY:O
bi21 = KEY:N
bi27 = KEY:R

[axes]
aim_x.neg = KEY:LEFT:cond=!SHIFT
aim_x.pos = KEY:RIGHT:cond=!SHIFT
aim_x = MOUSE:X:mode=aim
aim_y.neg = KEY:UP:cond=!SHIFT
aim_y.pos = KEY:DOWN:cond=!SHIFT
aim_y = MOUSE:Y:mode=aim
rot.neg = KEY:A
rot.pos = KEY:D
sight_x.neg = KEY:LEFT
sight_x.pos = KEY:RIGHT
sight_x = MOUSE:X:mode=sight
sight_y.neg = KEY:UP
sight_y.pos = KEY:DOWN
sight_y = MOUSE:Y:mode=sight
pedal_l = KEY:LCTRL, MOUSE:X1, MOUSE:X2
pedal_m = KEY:S
pedal_r = KEY:W

[gear]
gear.up = KEY:E
gear.down = KEY:Q
tuner.up = KEY:T
tuner.down = KEY:G

[vr]
# Client-Aktion (kein Controller-Element): VR-Blick zentrieren (W159).
vr_recenter = KEY:F8

[client]
# Client-Aktion (kein Controller-Element, W188): Spiel anhalten/fortsetzen
# (Pause-Bildschirm). Tasten wertet das Fenster aus, Pad/Controller der Hook.
pause = KEY:PAUSE
# W195 PHOTO-MODE: Fotomodus oeffnen / im Fotomodus Foto aufnehmen (Tasten wertet das Fenster aus).
photo = KEY:F12
