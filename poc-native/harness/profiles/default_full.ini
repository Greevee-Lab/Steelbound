# default_full - Standardbelegung mit Taste fuer JEDE Aktion (W431), Tastatur + Maus.
# Basis = keyboard_default (alle dortigen Belegungen unveraendert), dazu die
# bisher unbelegten Elemente. keyboard_default bleibt unveraendert (Legacy,
# Golden/Replays). Eigene Profile werden nie angefasst. Tabelle: docs/community/CONTROLS.md.
# W438 CTRL-RESET-040 (0.4.0): START (bi6) auf BACKSPACE, ENTER bleibt frei (LoC-Chat),
# ESC bleibt das Client-Menue. Einmaliger Reset aller Spieler auf dieses Profil (Launcher).
# Format: s. poc-native/docs/EINGABE.md. Zeilen "element = quelle, ...".
# Quellen: KEY:<name>, MOUSE:LEFT/RIGHT/MIDDLE/X/Y, PAD:... (hier ungenutzt).
# Kein eingebauter Fallback: fehlt die Datei, gilt Legacy (keyboard_default).

[buttons]
bi0 = KEY:SPACE, MOUSE:LEFT
bi1 = KEY:F, MOUSE:RIGHT
bi2 = KEY:L, MOUSE:MIDDLE
bi3 = KEY:SHIFT+KEY:DELETE
bi4 = KEY:H
bi5 = KEY:I
bi6 = KEY:BACKSPACE
bi8 = KEY:M
bi9 = KEY:TAB
bi11 = KEY:Z
bi12 = KEY:X
bi13 = KEY:V
bi18 = KEY:C
bi20 = KEY:O
bi21 = KEY:N
bi27 = KEY:R
bi7 = KEY:B
bi10 = KEY:J
bi14 = KEY:U
bi15 = KEY:K
bi16 = KEY:Y
bi17 = KEY:P
bi19 = KEY:END
bi22 = KEY:F4
bi23 = KEY:F5
bi24 = KEY:F6
bi25 = KEY:PAGEUP
bi26 = KEY:PAGEDOWN
bi28 = KEY:6
bi29 = KEY:7
bi30 = KEY:8
bi31 = KEY:9
bi32 = KEY:0
bi33 = KEY:F7
bi34 = KEY:1
bi35 = KEY:2
bi36 = KEY:3
bi37 = KEY:4
bi38 = KEY:5

[axes]
aim_x.neg = KEY:LEFT:cond=!SHIFT
aim_x.pos = KEY:RIGHT:cond=!SHIFT
aim_x = MOUSE:X:mode=aim
aim_y.neg = KEY:UP:cond=!SHIFT
aim_y.pos = KEY:DOWN:cond=!SHIFT
aim_y = MOUSE:Y:mode=aim
rot.neg = KEY:A
rot.pos = KEY:D
sight_x.neg = KEY:LEFT
sight_x.pos = KEY:RIGHT
sight_x = MOUSE:X:mode=sight
sight_y.neg = KEY:UP
sight_y.pos = KEY:DOWN
sight_y = MOUSE:Y:mode=sight
pedal_l = KEY:LCTRL, MOUSE:X1, MOUSE:X2
pedal_m = KEY:S
pedal_r = KEY:W

[gear]
gear.up = KEY:E
gear.down = KEY:Q
tuner.up = KEY:T
tuner.down = KEY:G

[vr]
# Client-Aktion (kein Controller-Element): VR-Blick zentrieren (W159).
vr_recenter = KEY:F8

[client]
# Client-Aktion (kein Controller-Element, W188): Spiel anhalten/fortsetzen
# (Pause-Bildschirm). Tasten wertet das Fenster aus, Pad/Controller der Hook.
pause = KEY:PAUSE
# W195 PHOTO-MODE: Fotomodus oeffnen / im Fotomodus Foto aufnehmen (Tasten wertet das Fenster aus; W290: Shift+F12).
feedback_shot = KEY:F11
feedback_clip = KEY:F9
photo = KEY:SHIFT+KEY:F12
# W290 QUICK-SHOT: Schnell-Screenshot mit den Foto-Einstellungen (ohne Menue).
quick_shot = KEY:F12
# W283 ORIG-KEY-BIND: Original-Optik <-> eigene Einstellungen live (Rueckfall: [overlay] orig_key).
orig_view = KEY:SHIFT+KEY:F8
# W299 REPLAY: laufendes Spiel-Replay beenden (die Maus beendet Replays nicht; Pad/Original-Controller/Joystick wie im Original).
# W438: bewusst dieselbe Taste wie START (bi6): START hat im Spiel-Replay keine Wirkung (W299, Ghidra),
# so beendet die START-Taste ein Replay. Nur waehrend der Wiedergabe aktiv.
replay_exit = KEY:BACKSPACE
# W374 LOC-NET-OVERLAY: Netz-Overlay an/aus (Umschalt + Taste: Ecke wechseln).
net_hud = KEY:F3
# W431: Waffenarm zur Mitte (virtueller Hebel von Maus/relativem Stick).
aim_center = KEY:HOME
# W438: Zurueck in den Line-of-Contact-Menues (Taste B des virtuellen Menue-Pads).
menu_back = KEY:INSERT
# W437: Chatzeile oeffnen (nur Line of Contact online; Enter sendet, Escape bricht ab).
chat = KEY:ENTER
