# xbox_pad_default - Xbox-Gamepad + Tastatur parallel (OR / Max-Abs).
# Die Tastatur-Belegung aus keyboard_default bleibt voll aktiv (Replay- und
# Bot-Laeufe laufen unveraendert); das Pad ergaenzt. Format: EINGABE.md.
#
# Pad-Kurzfassung: linker Stick = Zielen (Aiming), rechter Stick X =
# Drehhebel + Sicht X, rechter Stick Y = Sicht Y, LT/RT = Bremse/Gas
# (analog), LB = Lock-On, RB = Hauptwaffe, LB+RB = Magazin, A = Chaff,
# B = Subwaffe, X/Y = Sub-/Hauptwaffenwahl, D-Pad = Tuner/Submonitor,
# Start = START, BACK = Zweitebene (Startsequenz, Gang, Seltenes).

[buttons]
bi0 = KEY:SPACE, MOUSE:LEFT, PAD:RB
bi1 = KEY:F, MOUSE:RIGHT, PAD:B
bi2 = KEY:L, MOUSE:MIDDLE, PAD:LB
bi3 = PAD:BACK+PAD:Y
bi4 = KEY:H, PAD:BACK+PAD:X
bi5 = KEY:I, PAD:BACK+PAD:A
bi6 = KEY:ENTER, PAD:START
bi8 = KEY:M
bi9 = KEY:TAB
bi10 = PAD:DL, PAD:DR
bi11 = KEY:Z
bi12 = KEY:X
bi13 = KEY:V
bi16 = PAD:BACK+PAD:START
bi17 = PAD:L3
bi18 = KEY:C, PAD:A
bi20 = KEY:O, PAD:BACK+PAD:B
bi21 = KEY:N, PAD:BACK+PAD:L3
bi25 = PAD:Y
bi26 = PAD:X
bi27 = KEY:R, PAD:LB+PAD:RB
bi33 = PAD:R3
bi34 = PAD:BACK+PAD:DL
bi35 = PAD:BACK+PAD:DR
bi36 = PAD:BACK+PAD:DU
bi37 = PAD:BACK+PAD:DD
bi38 = PAD:BACK+PAD:R3

[axes]
aim_x.neg = KEY:LEFT:cond=!SHIFT
aim_x.pos = KEY:RIGHT:cond=!SHIFT
aim_x = MOUSE:X:mode=aim, PAD:LX:dz=0.15:curve=1.5
aim_y.neg = KEY:UP:cond=!SHIFT
aim_y.pos = KEY:DOWN:cond=!SHIFT
aim_y = MOUSE:Y:mode=aim, PAD:LY:dz=0.15:curve=1.5:inv=1
rot.neg = KEY:A
rot.pos = KEY:D
rot = PAD:RX:dz=0.12:curve=1.3
sight_x.neg = KEY:LEFT
sight_x.pos = KEY:RIGHT
sight_x = MOUSE:X:mode=sight, PAD:RX:dz=0.12:curve=1.3
sight_y.neg = KEY:UP
sight_y.pos = KEY:DOWN
sight_y = MOUSE:Y:mode=sight, PAD:RY:dz=0.12:curve=1.3:inv=1
pedal_l = KEY:LCTRL, MOUSE:X1, MOUSE:X2, PAD:BACK+PAD:LT
pedal_m = KEY:S, PAD:LT:dz=0.05
pedal_r = KEY:W, PAD:RT:dz=0.05

[gear]
gear.up = KEY:E, PAD:BACK+PAD:RB
gear.down = KEY:Q, PAD:BACK+PAD:LB
tuner.up = KEY:T, PAD:DU
tuner.down = KEY:G, PAD:DD

[vr]
# Client-Aktion (kein Controller-Element): VR-Blick zentrieren (W159).
vr_recenter = KEY:F8

[client]
# Client-Aktion (kein Controller-Element, W188): Spiel anhalten/fortsetzen
# (Pause-Bildschirm). Tasten wertet das Fenster aus, Pad/Controller der Hook.
pause = KEY:PAUSE
# W195 PHOTO-MODE: Fotomodus oeffnen / im Fotomodus Foto aufnehmen (Tasten wertet das Fenster aus).
feedback_shot = KEY:F11
feedback_clip = KEY:F9
photo = KEY:F12
