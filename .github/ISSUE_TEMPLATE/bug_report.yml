# Issue form "Bug report" (in-game feedback).
# The in-game feedback (F11 / F9 / ESC -> Feedback) opens issues/new?template=bug_report.yml
# and pre-fills title, version, game, gpu and state. Field ids must stay in sync with
# poc-native/harness/src/sb_feedback.c (URL parameters). New fields need new ids.
name: Bug report
description: Something does not work as expected (in-game F11 / F9 / Esc → Feedback, or by hand).
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the **Known issues** in the README first.
        If you used **F11**, **F9** or **Esc → Feedback** in the game, a folder with
        `screenshot.jpg` (or `clip.mp4`), `log.txt`, `info.txt` and `text.txt` opened next to
        this page. Please drag those files into the *Attachments* field below.
        The client removes user name, computer name and paths from these files, but please
        have a quick look before you attach them.
        **Never attach game files (ISO, XBE, extracted game data, saves).**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        Steps: 1. ... 2. ... 3. ...
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: input
    id: mission
    attributes:
      label: Mission
      description: Mission number or name, or where it happened (menu, briefing, movie ...).
      placeholder: "e.g. Mission 3, or main menu"
  - type: input
    id: vt
    attributes:
      label: VT
      description: The VT you were piloting, if in a mission.
  - type: dropdown
    id: repro
    attributes:
      label: Does it happen again?
      options:
        - Every time
        - Sometimes
        - Only once so far
        - Not tried again
  - type: textarea
    id: settings
    attributes:
      label: Settings
      description: Graphics preset, display mode, resolution, frame rate, controller type – anything you changed. info.txt from the feedback folder covers most of this.
      placeholder: "e.g. Original (HD) – 120 FPS, borderless, 2560x1440, keyboard/mouse"
  - type: textarea
    id: files
    attributes:
      label: Attachments
      description: Drag screenshot.jpg or clip.mp4, log.txt and info.txt from the feedback folder here.
  - type: input
    id: version
    attributes:
      label: Client version
      description: Filled in by the game (edition and build), or see VERSION.txt in the program folder.
  - type: input
    id: game
    attributes:
      label: Game image
      description: Filled in by the game (detected version of your own copy).
  - type: input
    id: gpu
    attributes:
      label: GPU
      description: Filled in by the game, or your GPU model and driver version.
  - type: input
    id: state
    attributes:
      label: Game state
      description: Filled in by the game (mode, scene, mission countdown).
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I did not attach any game files (ISO, XBE, extracted game data, saves).
          required: true
        - label: I checked the Known issues in the README.
