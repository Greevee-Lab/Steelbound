# sb_player.cfg - Spieler-Konfiguration (W152 COMM-CFG)
# Community-Standard: nur Spielerwerte, keine Test-Voreinstellungen (kein
# Replay/Turbo, keine Auto-Screenshots, kein Audio-Mitschnitt, echte Eingabe
# an). Entspricht sb_native.cfg + Spielerbetrieb-Block des Launchers
# (launcher_cfg.c kPlayer: 16 Schluessel) + Maus absolut; die Spielpfade
# (xbe_path/media_root) setzt der Spieler im Launcher (user.cfg).
# Tests nutzen weiter sb_native.cfg. Der Community-Build kopiert diese Datei
# als sb_native.cfg neben die Binaries (CMake); package_edition.py stagt sie
# als sb_native.cfg (Spielpfade dabei geleert).
# sb_native.cfg - Tuning fuer den nativen Harness
[xbe]
# W116 Community: Pfad zur eigenen default.xbe bzw. zum eigenen XISO-Ordner setzt der Launcher (user.cfg)
xbe_path=
[game]
# W116 Community: Pfad zur eigenen default.xbe bzw. zum eigenen XISO-Ordner setzt der Launcher (user.cfg)
media_root=
# Partition1 (Festplatte, beschreibbar): TDATA/UDATA/Saves landen hier (relativ ok)
hdd_root=HDD
# W187 KIA-LOAD: Spielstaende (T:) vor dem Start pruefen: 1 = reparieren (Sicherung unter
# <hdd_root>\_backup\), 2 = nur melden, 0 = aus. Verhindert "Unable to load KIA Record." u. a.
save_check=1
# W190 SAVE-LOCK: 1 = Spielstaende schuetzen (Testhilfe): T:/U: laufen in eine Wegwerf-
# Arbeitskopie <hdd_root>\_savelock, Pilot-Tod/Speichern aendert die echten Staende nicht;
# beim naechsten Start verworfen. 0 = Original (Standard). Launcher: Erweitert, ESC: Allgemein.
save_lock=0
# Anzeige: Backbuffer-Groesse (Ultrawide-Default 21:9, Hor+ statt Stretch).
# present_interval: 0 = uncapped (fps_limit regelt), 1 = VSync.
[display]
width=2560
height=1080
present_interval=0
# 1 = Fenster unsichtbar (ausserhalb der Monitore, kein Fokus); run_once.ps1 setzt das fuer Testlaeufe
window_hidden=0
# 1 = Fenster gehoert eigenem UI-Thread (erzeugt+pumpt, schliessbar/verschiebbar), 0 = alt
ui_thread=1
# W81 WINMODE: 0 = Fenster (bisher), 1 = randloses Vollbild (Monitor des Fensters),
# 2 = exklusives Vollbild (Modus fs_width x fs_height @ fs_hz; 0 = Desktop-Aufloesung/-Rate).
# Alt+Enter schaltet Fenster <-> Vollbild (alt_enter=1; Art bei window_mode=0: alt_enter_mode
# 1 = randlos, 2 = exklusiv). Nie strecken: der Backbuffer nimmt die neue Groesse an
# (2D/Filme/Menues mit Balken, Mission Hor+). fs_monitor: 0 = Monitor des Fensters, N = N-ter Ausgang.
window_mode=0
fs_width=0
fs_height=0
fs_hz=0
fs_monitor=0
alt_enter=1
alt_enter_mode=1
# 1 = Backbuffer folgt der Fenstergroesse (Ziehen/Maximieren, nie strecken), 0 = alt (DXGI streckt)
win_resize=1
# -1 = auto (Per-Monitor-DPI nur bei window_mode>0, scharfes Vollbild bei Skalierung), 0 = aus, 1 = an
dpi_aware=-1
# 1 = exklusiv: Zwischenbild-Takt (interp_fps>0) = Bildwiederholrate des Modus (60..240 Hz)
fs_interp_match=1
# Test (W81): 1 = Trockenlauf (Fenster bleibt ausserhalb des Bildschirms, kein SetFullscreenState;
# window_hidden=1 erzwingt das). winmode_alt_every=N: alle N Presents Alt+Enter/Fokus per PostMessage.
winmode_test=0
winmode_alt_every=0
winmode_alt_from=0
winmode_alt_max=8
fps_limit=120
# Menues im Zeitraffer: FPS-Limit erst ab Frame N (0 = aus). NUR mit
# zustandsgesteuertem replay_steps sinnvoll (Ladephasen laufen in Echtzeit).
turbo_until_frame=0
# Zeitraffer bis Spielmodus (u32 0x2EEA34: 1 Logos, 2 Titel, 3 Menues,
# 4 Missions-Load): fps_limit erst ab Modus N (0 = aus). 4 = bis
# Missions-Load. Nur mit zustandsgesteuertem replay_steps sinnvoll.
turbo_until_mode=0
# VBlank-Takt (A4, W48 REALTIME): 60 = Xbox-Echtzeit (Spieler-Standard;
# Zaehler + Waits aus echter Zeit, Mission 30 Hz, max. 60 FPS). 0 = aus
# (Testtakt: VBlank-Waits sofort, Spieltakt zu schnell; run_once.ps1 setzt 0, -realtime = Opt-out).
vblank_hz=60
# W69/W73: 1 = VBlank-Zaehler aus QPC statt GetTickCount (gleichmaessige 33,3-ms-Fenster statt 31,25/46,9 ms;
# Spieler-Standard seit W73, wirkt nur mit vblank_hz>0), 0 = alt (GetTickCount, 15,6-ms-Stufen)
vblank_qpc=1
# TEST(POPIN,W91): rt_from_mission=60 -> Testtakt (vblank_hz=0) bis Missionsbeginn (Modus 4) + rt_delay Frames,
# dann Echtzeit mit 60 VBlanks/s (Feldzaehler monoton); rt_fps_limit = fps_limit ab dann (0 = unveraendert). 0 = aus
rt_from_mission=0
rt_delay=0
rt_fps_limit=0
# TEST(PERF-BENCH,W137): rt_mission_any=1 -> rt_from_mission ohne Modus-4-Bedingung (erster Missionsbeginn, Kette ohne Titel-Demo).
# rt_from_film=60 -> Testtakt bis zum ersten Film (*.bik), dann Echtzeit; rt_interp_fps=120 -> beim Echtzeit-Wechsel
# (rt_from_film/rt_from_mission) Zwischenbilder einschalten (Weg wie Overlay-Bildratenwechsel). movie_skip_delay=N:
# movie_skip-Tasten erst N Spiel-Frames nach der Filmerkennung (Film-Messfenster). Alle 0 = aus.
rt_mission_any=0
rt_from_film=0
rt_interp_fps=0
movie_skip_delay=0
# Rendering-Tuning (M2: RenderState-/Transform-Hooks)
[render]
fog_scale=1.0
draw_distance_scale=1.0
# 1 = Linear-Textur-Masse aus Xbox-Size-Feld (statt Speicherlayout-Heuristik)
tex_size_header=1
# 1 = IM-Vertexbuffer als Ring (NO_OVERWRITE) statt DISCARD pro Draw
im_ring=1
# 1 = D3D11-Immediate-Context-Aufrufe per Lock serialisieren (DIAG(CTXTHREAD) zaehlt Fremd-Threads)
ctx_lock=1
# 1 = Textur-Cache-Eintrag bei Release Refcount 0 entfernen statt dirty (TEXLIFE)
tex_evict=1
# W63 TEXCACHE: Textur-Cache-Kapazitaet (Eintraege, max 4096; 256 = alt - lief in Mission 1 beim Fahren voll)
tex_cache_max=2048
# W63 TEXCACHE: 1 = Cache voll -> laengst unbenutzten Eintrag freigeben (Re-Upload bei Bedarf), 0 = alt (neue Texturen bleiben NULL)
tex_cache_lru=1
# W63 TEXCACHE: 1 = Cache-Treffer prueft den Texturkopf (Data +4/Format +0xC) und laedt bei Neubelegung derselben xptr sofort neu (Refresh-Takt je Eintrag), 0 = alt
tex_hdr_check=1
# 1 = Upload-Quelle vor CreateTexture2D voll per VirtualQuery pruefen (TEXLIFE)
tex_upload_guard=1
# 1 = Lineartexturen als Texel-Rechteck: UV/(w,h) auch ohne RHW (A2, Briefing-Film)
lin_tex_rect=1
# W67/A9 entfernt (Diagnose-Altlasten, null Verhaltensaenderung): tex_solid, lin_force_rhw, tex_identity_heap, ps_debug, tex_watch, tex_keepn, tex_point, tex_rgba8, tex_lod0, blend_force_off, mon_slotdump, mon_texprobe, wash_diag, edge_diag, rs_diag, m3d_world_ident
# W2B-FIX: 1 = linearer VB-Quad/Strip in Pixel-Range als RHW (Film sichtbar)
lin_rhw_range=1
# W18 ASPECT (Regel S3.10, nie strecken): 1 = 2D in zentrierter Spiel-Aspect-Box (Pillarbox/Letterbox, schwarze Balken) + 3D Hor+, 0 = alt (2D auf Vollbild gestreckt)
aspect_mode=1
# W107 EDGE-MODE: Bildraender im Breitbild ausserhalb der 4:3-Box (Hor+-Rand der 3D-Szene; HUD/2D/Filme liegen ohnehin in der Box): 0 = aus (volles Hor+), 1 = harter Schnitt (exakt 4:3, schwarze Balken auch fuer 3D), 2 = Abdunklung (ab der Boxkante Verlauf ins Schwarze). Maske im Present-Pfad, mit FPS-INTERP erst im Swapchain-BB (nach interp_verify)
edge_mode=0
# W107: Verlaufsbreite in Prozent der 4:3-Boxbreite (12 = 173 px bei 2560x1080), 0 = harte Kante; Endabdunklung in Prozent (100 = schwarz)
edge_fade_width=12
edge_fade_strength=100
# DIAG(EDGE-MODE,W107): 1 = zu jedem Screenshot zusaetzlich shot_<f>_e1 (harter Schnitt) und _e2 (Abdunklung) aus demselben Bild (A/B ohne Szenenunterschied)
edge_ab=0
# W23 RTT: 1 = Render-to-Texture umleiten (D3D11-RTV+SRV je Offscreen-Surface, Menue sichtbar), 0 = nur notieren (Backbuffer-Pfad)
rtt=1
# FIX(COMBAT,W59): 1 = lineare X8R8G8B8-Render-Targets bis 128x128 nach jeder RT-Session GPU->CPU in den Xbox-Speicher zurueckschreiben (Spiel liest die 128x128-Zellenkarte [0x35149C] fuer Lock-On/Auto-Ziel per CPU), 2 = zusaetzlich A8R8G8B8 bis 128x128, 3 = beide bis 512x512, 9 = DIAG (Mechanik ohne Schreiben), 0 = alt (RT-Inhalt nur auf der GPU, kein Lock-On)
rtt_readback=1
# FIX(CULL-POPIN,W215): Sicht-Zellenkarte (X8R8G8B8 128x128) im selben Spiel-Bild in den Xbox-Speicher, wie auf der Xbox (Gelaende-/Objektauswahl FUN_00025E20/FUN_00021EB0 gilt fuer dieses Bild). 2 = die fuenf Faecher der Karte zusaetzlich auf der CPU rastern (D3D11-Regeln, kein GPU-Warten; Session mit unbekannten Draws -> wie 1), 1 = GPU-Kopie am Session-Ende, Abholung, wenn das Spiel per BlockOnFence auf die GPU wartet (Spiel-Thread wartet 1-2 ms, Spitzen ~7 ms); 0 = alt (asynchron, >= 1 Session alt -> Gelaende fuer eine aeltere Kamera ausgewaehlt, Landschaft verschwindet/erscheint beim Drehen)
rtt_rb_sync=2
# W215: Versatz der CPU-Rasterung (rtt_rb_sync=2) in 1/256 Pixel auf die Xbox-Pixelkoordinaten; 0 = deckungsgleich mit dem GPU-Pfad (W215_e2/e4: 0 bzw. 4 von 12870 Sessions abweichend, 128 = 200 Zellen je Session)
rtt_rb_cpu_ofs=0
# DIAG(CULL-POPIN,W215): N > 0 = alle N Zellenkarten-Sessions (laufende Mission) Zeile RTTRB: Alter des Inhalts, fehlende Zellen gegen frischen Inhalt, Wartezeit der Abholung; 1 = 300. Zusaetzlicher blockierender Readback (aendert das Timing), mit rtt_rb_sync=2 zusaetzlich Zeile RTTRB cpu (Abdeckung CPU gegen GPU je Kanal); -N = nur Alter/Skip/Wartezeit ohne Zusatz-Readback; 0 = aus
rtt_rb_diag=0
# FIX(SIDESMEAR,W45): 1 = Draws, die ihr eigenes RT sampeln (Stage0 == gebundenes RT), per Scissor auf Aspect-Box clippen (Seiten schwarz, Mitte exakt wie bisher), 0 = alt (Vollbild-Schmier)
rtt_selfclip=1
# FIX(FX-HOLE,W106): 1 = Draws, die ihr eigenes RT sampeln (z. B. Hitzeflimmer-Sprites des Rauchs in RT31, Linien-Blits in RT40), zeichnen ins RT und lesen eine Kopie (Xbox: Lesen+Schreiben derselben Flaeche); 0 = alt (Umbinden auf den Backbuffer: Sprites + Folge-Draws landen ohne Tiefentest auf dem Cockpit = Loecher beim Feuern). Mit 1 ist rtt_selfclip wirkungslos
rtt_selfcopy=1
# FIX(MAP-RETRY,W124): 1 = veraltete RT-Eintraege (Textur per Release freigegeben, neue RT auf derselben Datenadresse, Surface mit neuer Datenadresse)
# beim Sampeln ueberspringen; unter mehreren Daten-Treffern gilt der zuletzt gerenderte; volle RT-Tabelle verdraengt zuerst veraltete Eintraege.
# 0 = alt (erster Daten-Treffer: nach Tod + Wiederholen sampelten Texturen der neu geladenen Mission alte RT-Inhalte, z. B. Meer weiss)
rtt_stale=1
# FIX(W38): swizzled 32-Bit-Code 0x06 (EmuUnswizzleBox-exakt, z.B. Wash-Textur) laden (0=aus, 1=an, 2=an+Einmal-Dump)
tex_swz06=1
# DIAG(MISSION3D,W25, temporaer): Missions-Zensus (Szene 0x2C, mloop=1): 1. Missions-Frame + alle N Frames, max 6 Frames (0=aus)
m3d_census=0
# DIAG(MONITORVIEW,W36, temporaer): Missions-Zensus erst ab VT-online ([0x53831C]==1, nach START) statt ab 1. Missions-Frame (1=an, 2=nur Kampagnen-Mission Modus 4 (W101), 3=Modus 4 und VT online (W106), braucht m3d_census>0)
m3d_census_gate=0
# FIX(WASH,W50): 1 = IM-Diffuse ohne Color-Call aus oD0-Quellregister des VSH (Wash korrekt transluzent), 0 = alt (stale Slot 3)
vsh_color=1
# FIX(TITLEBG2,W54): explizites (0,0,0,0) per Color-Call (Titel-Overlay, Vollbild, geblendet) bleibt transparent statt Weiss-Fallback (1=an, 0=alt/weiss)
im_zero_explicit=1
# FIX(RADAR,W56): Alpha-Kanal mit denselben Blend-Faktoren wie Farbe blenden (Xbox/D3D8, Radar sichtbar), 0 = alt (Alpha-Replace, Radar-Geist)
blend_alpha=1
# FIX(COCKPIT,W60): VB-UV SHORT2 (0x25, Monitor-Face-Decl) roh = Texel-Koords in Lineartexturen (NV2A/cxbx), Normierung per lin_tex_rect -> Cockpit-Monitore zeigen RT-Inhalt (1=an, 0=alt: /32767, Faces sampeln eine Ecke)
short2_raw=1
# PERF(IM-PERF,W99): VB-Draws kompakt dekodieren (40 statt 256 B je Vertex) und direkt in IM-Ring/Tick-VB expandieren
# (keine Zwischenkopien, Bild bitgleich). 1=an, 0=alt, 2=DIAG Selbstpruefung alt gegen neu (Zeile IMCHK, langsam)
im_fast=1
# FIX(EDGE,W64): End() schliesst den IM-Batch; sonst wiederholte der naechste VB-Draw den letzten Begin/End-Draw mit SEINEM State
# (Geister-Draw, Mission: Wash-Quad mit Face-VS -> helle Flaeche oben rechts im Hor+-Rand). 1=an, 0=alt
im_end_reset=1
# FIX(WORLDVIEW,W65): Pixel-Shader mit Textur-Stufe 0 = NONE (PSTextureModes) sampeln die gebundene Stage-0-Textur nicht
# (Sicht-Zellenkarte sonst mit Fremd-Texel multipliziert -> Gelaende/Gegner fehlen im Hauptmonitor). 1=an, 0=alt
ps_texmode=1
# FIX(WORLDVIEW,W65): Clip-Raum-Draws (alter 3D-Pfad) in RTs ueber den Spiel-Viewport abbilden (RT31 512x512, Viewport 512x422), 1=an, 0=alt (gestreckt)
rt_vp_clip=1
# FIX(WORLDVIEW,W65): Textur-Daten im selben Speicherblock wie der Header (Inline-XPR) direkt lesen statt per Low28-Contig-Suche (traf fremde Bloecke -> Nullen, Hangar schwarz). 1=an, 0=alt
tex_inline_data=1
# W88 RENDER-RES: Welt-/Monitor-Render-Targets (Hauptmonitor 512x512, Sub-Monitor/FRONT VIEW 256x256 + deren Kompositions-RTs)
# mit Faktor N anlegen (schaerfere Aussenwelt). 1 = Xbox-Groesse (alt), 2..4 = Faktor, auto = nach Ausgabehoehe (ceil(h/640), max 4).
# Nur RTs mit beiden Kanten rt_scale_min..512 und ohne CPU-Rueckschrieb (Zellenkarte bleibt 1:1); Menue-/Titel-RTs (640x480, 1024x1024) bleiben 1x.
rt_scale=auto
rt_scale_min=256
# W146 GPU-COST rt_scale_dyn=1: Render-Skalierung dynamisch (Sicherheitsnetz fuer 120 FPS): GPU je Zwischenbild
# (asynchrone Timestamps) > rt_scale_dyn_hi (0,1 ms) ueber 1 s -> RT-Faktor eine Stufe runter (nicht unter
# rt_scale_dyn_min), < rt_scale_dyn_lo ueber 8 s -> eine Stufe hoch (hoechstens auto-/rt_scale-Faktor), >= 2 s
# zwischen Wechseln, Pendelsperre 60 s. RTs werden am Swap-Anfang neu angelegt; logische Groesse/Abbildung bleiben
# (nie gestreckt). Nur wirksam, wenn rt_scale skaliert (auto oder 2..4) - mit rt_scale=1 (Testlaeufe) ohne Wirkung.
# Log RT-DYN: Faktor a -> b ..., F2-Panel "RT<n>d". 0 = statisch (alt)
# Steuer 6.11. (V_C25p): Standard 0 - jeder Stufenwechsel legt die RTs neu an (Tick bis 177 ms, Bildspitzen) und
# die Stufe pendelte (3->2->3, 4->3->2->3). Erst wieder an, wenn der Wechsel ohne Neuanlage geht (GPU-COST2).
rt_scale_dyn=0
rt_scale_dyn_min=2
rt_scale_dyn_hi=70
rt_scale_dyn_lo=45
# FIX(PHYSALIAS,W86): LockRect prueft Schreibbarkeit des vollen Lock-Bereichs (fremder/zu kleiner Block -> Fallback + TEX lock-guard, kein AV 0x24E1D3). 1=an, 0=alt (nur Lesbarkeit)
tex_lock_guard=1
# DIAG(WORLDVIEW,W65, temporaer): 1 = RT31/S40 am Session-Ende im Zensus-Frame dumpen + WVCELL (Zellenkarte je Kanal), 2 = RT >= 512 px nach jedem Farb-Draw dumpen
wv_diag=0
# RENDER-QA (W77): Shading nach NV2A-Semantik in der Mission: Vertex-Programm des Spiels als GPU-VS (Licht oD0/oD1,
# Nebelabstand oFog, Texgen oT1..3), Register-Combiner-Pixelshader (bis 8 Stufen, Texturstufen 0..3), Nebel im
# Final-Combiner (FOG_PARAMS wie XDK-D3D), Adressmodi je Stufe. 0 = alt (Vertexfarbe x Textur Stufe 0), 1 = an (Standard seit 5.11.)
shading=1
# DIAG(RENDER-QA): Teilfunktionen bei shading=1: 1 Nebel, 2 Vertex-Licht (oD0/oD1), 4 Texturstufen 1..3,
# 8 lange Combiner-Ketten (>= 5 Stufen: Monitor-Komposition/Filter), 16 2D-Kompositionen (P1: HUD/Karte/Filter) (W100: Default 31 - mit shade_psconst=1 liegen die
# Laufzeit-Konstanten vor, Komposition/Filter/Radar rechnen korrekt; frueher 7: Ketten aus -> Ueberbelichtung); shade_cfix=1: Draws mit fehlender
# Faktor-Konstante wie bisher (HLE-Luecke);
# shade_scope: 0 = nur Mission (Szene 0x2C, mloop=1), 1 = ueberall (Menues/Titel wuerden sich aendern)
shade_mask=31
shade_cfix=1
shade_scope=0
# SHADE-PERF (W80, nur bei shading=1 wirksam): shade_gpuvb=1: VB-Eingaenge roh hochladen, der generierte VS
# dekodiert die Decl-Formate und expandiert per SV_VertexID (keine CPU-Dekodierung/-Expansion), IM-Draws direkt in den
# Puffer, Konstanten-Fenster bei Gleichheit wiederverwenden; 0 = W77-CPU-Packen. shade_cache=1: uebersetzte Shader
# je Quelltext-Hash in <exe>/shadercache/ (kein Kompilier-Stocken), 0 = immer D3DCompile
shade_gpuvb=1
shade_cache=1
# SHADE-PERF (W80, Befund, nur bei shading=1): 1 = Combiner-Laufzeitkonstanten aus D3DDevice_SetRenderState_Simple
# (NV2A SET_COMBINER_FACTOR0/1 0x0A60/0x0A80, SPECULAR_FOG_FACTOR 0x1E20) uebernehmen, 2 = zusaetzlich Push-Buffer-Pool
# durchsuchen (RQPBSCAN, mit rq_perf); Befund W80: beide Wege liefern 0 Werte -> 0 (Standard)
shade_pbconst=0
# FIX(PSCONST,W84, nur bei shading=1): 1 = D3DDevice_SetPixelShaderConstant in den Konstanten-Spiegel uebernehmen
# (Verteilung per PSC0/PSC1/Final-Mapping des aktiven PS wie im XDK, SetPixelShader laedt Def) - wirkt auf Shading-Pfad
# und fx_ps_c0 (W100: nur in der Mission). Der W77-Mitschreiber war von hook_D3D_PSConst ueberdeckt ("0 Aufrufe" = Messfehler).
# 0 = Def-Werte. W100: Default 1 (wirkt nur mit shading=1)
shade_psconst=1
# FIX(RENDER-QA3,W100, nur bei shading=1): 1 = Schattenpuffer: der Tiefenpass FUN_00031590 (Dummy-Farbflaeche Data=0 +
# 2048^2 LIN_F16-Tiefe) zeichnet in ein eigenes Tiefen-RT, Stufe 1 der Welt-PS (0xAB7F850) vergleicht dagegen
# (NV2A "Tiefe FUNC r", D3DRS_SHADOWFUNC des Spiels = GREATER, r = z/w / 511.9375 bei F16, 2x2-PCF);
# 2 = Operanden ungetauscht (DIAG); 0 = T1 = 1 (alt, keine Schatten)
# W100: Standard 0 - mit 1 bildet die 120-FPS-Interpolation keine Paare (W100_oni2_kill pairs=0, ohne: 400/400)
# W127: Paarung behoben (Interp-Schattenkopie der typlosen Tiefe), Tiefenpass schreibt jetzt Tiefe (P2-Pfad); Standard
# bleibt 0 bis zur Entscheidung des Masters (BERICHT W127)
shade_shadow=0
# DIAG(SHADOWBUF,W127): shadow_diag=N (mit bloom_diag) = je Diag-Bild bis N Draws mit Schattenpuffer-Stufe protokollieren
# (BLOOM shadow/st/v/o/pre/post, Tiefe roh uint32) -> scripts/shadow_check.py; shadow_ab=1 = Screenshot-Bild ohne
# Schattenvergleich (T1 = 1), Partnerbild +1 mit -> Bildpaare shade_shadow 0/1 aus einem Lauf
shadow_diag=0
shadow_ab=0
# DIAG(RENDER-QA3,W100, nur shading=1): shade_dbg = Shading-PS gibt einen Term aus (nur 3D-Draws in RTs = Welt; 1 T0, 2 T1, 3 V0, 4 V1, 5 C0
# Stufe 0, 6 R0 vor Final, 7 FOG.a, 8 UV0 frac, 9 R1; 99 = je 1500 Frames weiter 0..9); shade_ab=1 = Shading nur im
# Bild nach jedem Screenshot (wird mitgeschossen) -> A/B-Bildpaare alt/neu aus einem Lauf
shade_dbg=0
# W112: shade_ab=2 = Shading in allen Bildern ausser dem Screenshot-Bild (Partnerbild +1 = eingeschwungener Shading-Zustand:
# Textur-Cache, zeitlich gemischte Bloom-RTs; shade_ab=1 zeigt im Shading-Bild Zustaende des alten Pfads)
shade_ab=0
# FIX(SHADE-BLOOM,W112, nur shading=1): 1 = Tiefenformate (0x2A..0x31, Schattenpuffer LIN_F16 der Welt-PS, Stufe 1) nicht als
# Farbtextur laden. Die Fehlversuche (je 16. Abruf) verbrauchten das Upload-Budget (12/Bild) -> Bodentextur nie geladen,
# T0 = 1, Boden flach hell -> Hauptmonitor-Komposition weiss (BERICHT W112). 0 = alt
shade_texskip=1
# FIX(SHADE-M2,W117): Sichtbarkeitstest (D3DDevice_Begin/EndVisibilityTest + GetVisibilityTestResult) als D3D11-Occlusion-
# Query. Das Spiel misst so, ob die Sonne sichtbar ist (Punkt-Draw FUN_0001D8F0, Index 0x3FFF/0x3FFE) und baut daraus die
# Blendung auf (Hauptpass-Umgebungslicht [0x358250] +0,26, additives Quad). Bisher lieferte der Hook immer 1 = sichtbar ->
# Dauerblendung, Hauptmonitor in M2/M9 weiss (BERICHT W117). 1 = nur mit shading=1 (shading=0 bitgleich), 2 = immer, 0 = alt
vis_query=1
# W117: 0 = nur die Sonnentests echt (Standard); 1 = alle Indizes (Objekt-Occlusion-Culling FUN_00025580: Objekte mit
# Ergebnis 0 werden nicht gezeichnet; Licht-Flares FUN_0001B900) - aendert die gezeichneten Objekte, nicht abgenommen
vis_query_all=0
# DIAG(SHADE-M2,W117): 1 = VISQ-Zeilen (Sonnentest: Ergebnis, Blendwerte [0x356D58]/[0x351684], Sonnen-Bildposition)
vis_diag=0
# DIAG(SHADE-BLOOM,W112): 1 = Bloom-Kette in Diag-Bildern (Screenshot-Bilder ab bloom_frame, mit shade_ab auch +1, hoechstens
# bloom_max, Abstand >= bloom_every) der Kampagnen-Mission Draw fuer Draw protokollieren (BLOOM-Zeilen) + RTs roh dumpen
# (shots/bl_*.bin, Auswertung scripts/bloom_check.py); 2 = jede Mission (auch Titel-Demo)
bloom_diag=0
bloom_frame=0
bloom_max=4
bloom_every=0
# FIX(TERRAIN-UV,W84): 1 = IM-Draws nehmen die UV aus dem oT0-Quellregister ihres Vertex-Programms (auch ILU-MOV der
# Licht-Programme: Boden-Raster der Mission, oT0 = v3) statt Slot 9/Fallback 2 (= Vertexfarbe -> Boden "Marmor/Wellen")
im_uv_ot0=1
# FIX(TEXMIP,W84): 1 = Mip-Kette der Xbox-Texturen (Format-Bits 16..19) mit hochladen (DXT1/3/5, swizzled 32 Bit)
# statt nur Stufe 0 (Flimmern/Moire verkleinerter Texturen); 0 = nur Stufe 0 (alt)
tex_mips=1
# FIX(TEXADDR,W84): 1 = alter Pfad sampelt Stufe 0 in der Mission mit dem Adressmodus des Spiels (D3DTSS_ADDRESSU/V)
# statt immer CLAMP; 0 = alt. (Befund W84: Missions-Draws nutzen fast nur CLAMP, Bildwirkung gering)
tex_addr=0
# DIAG(SHADE-PERF,W80): 1 = QPC-Zaehler je Abschnitt (VB-Schleife, Uebergabe, Shading-Teile, Present), Zeile RQPERF
# alle 300 Missions-Bilder (WERKZEUGE §26)
rq_perf=0
# FIX(DLGTEXT,W77): per CPU gerasterter Text (TextOut 0x194D25) in die Render-Target-Textur hochladen, 0 = alt
# (Standard 1 seit W85: Menue-Hilfezeilen, Namen, Hinweis-Dialoge, Ausbilder-Text sichtbar)
dlg_text_upload=1
# DIAG(DLGTEXT,W85): 1 = je TextOut-Aufruf Font/Zeichen/Farbe/Glyphe/Pixel loggen (DLGDIAG), nur mit dlg_text_upload=1 wirksam
dlg_diag=0
# FIX(DLGTEXT2,W97): mit dlg_text_upload=1 loescht der Spiel-Clear (Xbox D3DCLEAR_TARGET 0xF0) der Textebene auch deren
# Xbox-Speicher (sonst Altdaten/Bildmuell bzw. stehengebliebene Glyphen); 0 = alt
dlg_text_clear=1
# FIX(DLGTEXT3,W85): mit dlg_text_upload=1 bleibt die Glyphen-Fuellung (rep stosd 0x196033) im TextOut-Rasterer erhalten
# (der alte M1-NOP "MMIO-STOSD(196033)" loeschte jede Textzeile); 0 = alt (NOP)
dlg_text_raster=1
# DIAG(RENDER-QA): 1 = Zensus RQPS/RQVS/RQFOG/RQTSS/RQCOMBO (+ RQSTAGE/RQREF/RQSTAT mit shading=1), 2 = + RQDLG/RQTEX
# (Draws + Texturen ausserhalb der Mission, je 2000. Frame); rq_every = RQCOMBO/RQSTAT alle N Frames
rq_diag=0
rq_every=3000
# FPS-INTERP (W69): Zwischenbilder in der Mission (Spiellogik bleibt 30 Hz, +1 Tick Latenz).
# 0 = aus (bisheriges Verhalten), 60/120 = Ziel-Presents/s (K = interp_fps/30 Bilder je Tick).
# W73: Spieler-Standard 120; run_once.ps1 setzt fuer Testlaeufe interp_fps=0 (wie vblank_hz=0, -realtime = Opt-out)
interp_fps=120
# DIAG(FPS-INTERP): 1 = INTERP-Statistik, 2 = + Draw-Listen; interp_verify=N: exakte Wiedergabe jeden N-ten Tick pruefen
interp_diag=0
interp_verify=0
# PERF(TICK-PERF,W125): Tick-Last im Kampf (Spiel-Thread wartete auf die GPU). interp_bsets=N: N Reserve-Saetze der
# Interp-Tick-Puffer (VB/Stream 2/Konstanten) mit GPU-Fence; die Aufnahme nimmt einen Satz, den die GPU fertig gelesen hat,
# interp_bsets_nod=1: dessen erstes Map per NO_OVERWRITE statt DISCARD (DISCARD legt bei 40-64-MB-Puffern neuen Speicher an).
# interp_gpu_q=N: Zwischenbild (Wiedergabe) nur einreihen, wenn die GPU das N-letzte gezeigte Bild fertig hat, sonst verfaellt
# es (der Spiel-Tick hat Vorrang; sonst wartet der blockierende Sichtbarkeitstest auf eingereihte Zwischenbilder).
# interp_gpu_tight=T: letzter Tick laenger als T ms -> Grenze 1. 0 = jeweils alt
interp_bsets=2
interp_bsets_nod=1
interp_gpu_q=2
# PERF(GPU-COST,W146) interp_cockpit_cache: Zwischenbild-Cache. Bit 1 "ruhige Ziele": RTs, deren Ops im Tick alle
# exakt sind (Sub-Monitore, Karte ...), nicht neu zeichnen, sondern den Tick-Endstand kopieren. Bit 2 "BB-Anfang":
# der fuer alle t gleiche Anfang der Backbuffer-Ops (Clear, Cockpit-Gehaeuse) wird im ersten Zwischenbild des Paars
# gezeichnet und gesichert (Farbe + Tiefe), weitere Zwischenbilder kopieren ihn zurueck. Wackelt das Cockpit
# (interpoliert), endet der Anfang dort. 3 = beides, 0 = alt (alles je Zwischenbild neu).
# interp_cockpit_cache_min=N: mindestens N Draws im BB-Anfang
interp_cockpit_cache=0
interp_cockpit_cache_min=16
# PERF(PERF-BENCH,W137): Startgroesse der Interp-Tick-VBs in 1024 Vertices (1536 = 60 MB je Puffersatz: kein Ueberlauf-Tick
# + Neuanlegen beim Oeffnen des Hangars, Draws 1256 -> 2466). 0 = alt (1024 = 40 MB). W138: Standard 1536
interp_vb_kv=1536
interp_gpu_tight=0
# PERF(RENDER-THREAD,W126): render_thread=1 = Zwischenbild-Wiedergaben (interp_fps>0) auf einem eigenen Render-Thread
# in einen D3D11-Deferred-Context aufzeichnen; der Spiel-Thread fuehrt nur die fertige Command-List aus (+ Blit/Present).
# 0 = alt (Wiedergabe im Spiel-Thread). render_thread_core=K pinnt den Render-Thread auf Kern K (-1 = frei).
# W168 PERF-TICK: Standard 1 (siehe sb_native.cfg)
render_thread=1
render_thread_core=-1
# PERF(PERF-FIX,W138): present_decouple=1 = eigener Present-Takt-Thread (nur Echtzeit vblank_hz>0 mit interp_fps>0,
# nicht mit VR): zeigt die Zwischenbilder der Mission/Filme im 120-Hz-Takt (hochaufloesender Timer, unabhaengig vom
# Spiel-Tick; GPU hinterher -> bis 1/2 Bild warten statt verfallen) und wiederholt ausserhalb bzw. waehrend langer
# Ticks (Ladecode) das letzte gezeigte Bild (Bild unveraendert). Testtakt/Golden: ohne Wirkung. 0 = alt (Bilder nur
# aus den Spiel-Hooks). present_core=K pinnt den Takt-Thread (-1 = frei). Zeile PRESENT-TAKT alle 10 s.
# DIAG pd_diag=1: ctx_lock-Regionen > pd_diag_ms (0 = 4 ms) mit Ruecksprungadressen (sb_emu.map) loggen.
present_decouple=1
present_core=-1
pd_diag=0
pd_diag_ms=0
# PERF(PERF-WARM,W139): Missionsstart/Retry ohne Ruckler (BERICHT W139). Ursache: Im Ladebild faellt die GPU in den
# Leerlauf-Zustand P8 (210-330 MHz Kern, 405 MHz Speicher) und braucht nach dem ersten Missionsbild 0,3-0,4 s bis P0.
# warm_gpu=N (>0): der Present-Takt-Thread erkennt die Ladephase (Spiel praesentiert im Mittel seltener als alle 25 ms:
# Ladebild 30 Hz bzw. Ladecode; Menues/Ergebnisbild 60 Hz) und setzt je Wiederholbild k Einheiten GPU-Last ab
# (Command-List auf eigenen Hilfszielen, nie gezeigt, Context-Zustand wiederhergestellt). Einheit = Rechenschleife
# N*1024 Runden (64x64) + warm_gpu_mem Kopien 2048x2048 (Speichertakt). k wird nach der gemessenen GPU-Zeit auf
# warm_gpu_pct % der Bildperiode geregelt (0 = 85; 60 reicht nicht: Treiber bleibt in P8). Nur Echtzeit mit Takt-Thread; Testtakt/Golden ohne Wirkung.
# Zeilen WARM-GPU: Ladephase an/aus, WARM-GPU: 10s lasten=... einheiten=...
warm_gpu=16
warm_gpu_mem=2
warm_gpu_pct=85
# warm_shaders=1: shadercache beim Start auf einem Hilfs-Thread lesen und die D3D-Objekte vorab anlegen; das Spiel
# bekommt bei bytegleichem Blob das vorab angelegte Objekt (Shader-Erstellung je Missionsstart 12 -> 4 ms). Zeilen WARM:
warm_shaders=1
# warm_vbpre=1: alle Interp-Tick-Puffersaetze (4 Listen + interp_bsets Reserve, je ~128 MB) schon beim ersten Present
# mit Offscreen-BB (Bootbild) anlegen und einmal beruehren, statt beim ersten Missionsstart (dort blockierte die Anlage
# auch den Present-Takt: Luecken bis 89 ms). Zeile INTERP: Tick-Puffer vorab angelegt ...
warm_vbpre=1
# warm_vb=1: Interp-Tick-Puffer mit Anfangsdaten und ohne ctx_lock anlegen. NICHT empfohlen: GPU liest die Puffer
# danach langsamer (Kampf GPU je Zwischenbild +1-2 ms, W139_w1) und die Anfangsdaten belasten den Missionsstart.
warm_vb=0
# DIAG rtt_dump=1: RT-Inhalt beim ersten Servieren als shots/rtrd_*.jpg + Zeile RTT dump (W38). Blockierendes
# Ruecklesen unter ctx_lock (1-12 ms je Ziel, 10 Ziele beim Missionsstart und erneut beim Retry) -> seit W139 Standard 0.
rtt_dump=0
# DIAG warm_diag=1: D3D-Context-Aufrufe (Draw/Clear/Map/ExecuteCommandList) > warm_diag_ms (0 = 2 ms) loggen:
# WARM-DIAG lang: <ms> <stelle> T<tid> f=<present> erst=<VS/PS-Paar zum ersten Mal> vs=<p> ps=<p>
warm_diag=0
warm_diag_ms=0
# FIX(POPIN,W91): 1 = mehrfach gezeichnete Modelle (gleiche Signatur + gleiche Objektraum-Vertices, z. B. Haeuser,
# Cockpit-Teile) dem Vortick-Draw mit kleinstem Bildsprung zuordnen (gegenseitig naechster, eindeutig; sonst exakt).
# 0 = alt (Partner nach Draw-Reihenfolge: kommt eine Instanz ins Bild, wird mit dem Nachbarn interpoliert -> Aufpoppen)
interp_inst=1
# FIX(POPIN,W91): 1 = Durchgaenge derselben Instanz (gleiches Ziel + Geometrie + Matrix) gleich behandeln: ist einer
# exakt, werden alle exakt gezeichnet (sonst Z-Fighting-Streifen gelerpt gegen exakt in Zwischenbildern), 0 = alt
interp_pass=1
# DIAG(POPIN,W91): pf_ring=N = die naechsten N praesentierten Bilder (Spiel- und Zwischenbilder) ab pf_from Spiel-Frames
# nach Missionsbeginn (Modus 4) im GPU-Ring sammeln (kein CPU-Stall), danach shots/pf<s>_<i>_<art> + PF-Zeilen
# schreiben; pf_every = weitere Folge alle N Frames, pf_max = Deckel. Auswertung scripts/pf_check.py
pf_ring=0
pf_from=0
pf_every=0
pf_max=1
# FIX(COCKPIT,W60): GetVertexShader/GetPixelShader/GetVertexShaderConstant liefern den zuletzt gesetzten Stand (Spiel-Sichern/Restore um Sonder-Materialien), 0 = alt (Fake-Device -> VS=0, VB-Draws verworfen)
getstate_fix=1
# FIX(MONITORVIEW,W36): Tiefenpass auf Dummy-Surface (Data=0, COLOR_MASK=0) schreibt keine BB-Tiefe -> keine schwarzen Loecher im Pruefbildschirm (1=an, 0=alt)
mon_dummy_nodepth=1
# FIX(MONITORVIEW,W36): IM-Farbkanal ohne Color-Call mit Rohwert>1.0 (stale Register) -> Weiss statt Gelb (1=an, 0=alt)
mon_color_default=1
# DIAG(VSH2D,W38, temporaer): Vertex-Shader-Mikrocode je Handle einmal dumpen (VSH-Zeilen, 1=an)
vsh_dump=0
# FIX(VSH2D,W38): oPos per VSH-Emulation (Kompositions-Draws: Welt auf Monitor), 0=alter Pfad
vsh_emul=1
# W25 MISSION3D: 1 = Xbox-SetTransform-States (VIEW=0, PROJ=1, WORLD=6-9; Spiel nutzt 0/1), 0 = PC-Enum (alt, Matrizen bleiben null)
xbox_transform=1
# W25 MISSION3D: 1 = VSConst-Hooks schreiben CPU-Spiegel 0x21BCA8+r*16 (Xbox-Semantik, Fast tat das nie), 0 = No-Op (alt)
vsconst_mirror=1
# W25 MISSION3D: 1 = 3D-MVP aus VS-Konstanten c98-c101 (pro-Draw-WorldViewProj, homogen skaliert) + Hor+ (x-Spalte, 4:3-Basis); ins RT 1:1
m3d_vs_mvp=1
# W33 COLORMASK: 1 = NV2A COLOR_MASK (0x358) -> RenderTargetWriteMask (0 = immer ALL, alt)
rs_colormask=1
# W33 COLORMASK: 1 = NV2A Stencil-/DepthWrite-States -> D3D11 DepthStencil-State (0 = alt: RHW->off, sonst on)
rs_stencil=1
# W90 FX-ORIG: 1 = NV2A BLEND_EQUATION (0x350: ADD/SUB/REVSUB/MIN/MAX) + BLEND_COLOR (0x34C) abbilden (0 = alt: immer ADD, Faktor 1)
fx_blend_eq=1
# W90 FX-ORIG / W101 FRONT-HANGAR: 1 = NV2A DEPTH_FUNC (0x354) als D3D11-DepthFunc (0 = alt: immer LESS). Standard 1 seit W101: bei offener Luke zeigt die Front den Hangar (Fenster-Quad mit RT31-Welt besteht LEQUAL auf gleicher Tiefe; Nutzer-Playtest 3: Original zeigt den Hangar)
fx_zfunc=1
# W101/W177 CLEAR-FLAGS: 1 = Clear-Flags nach Xbox-Semantik (Farbe 0xF0, Z 0x1, Stencil 0x2; belegt per Disassembly D3DDevice_Clear 0x20DF80) fuer die D3D11-Clears, inkl. Textebenen-Anpassung (Hilfetext bleibt, W177_g3); 2 = TEST Stand W101 (ohne Anpassung, Hilfetext fehlt); 0 = alt (PC-Werte 1/2/4). Standard 0 bis PO-Entscheid (BERICHT W177)
clear_xbflags=1
# W90 FX-ORIG: 1 = NV2A Alpha-Test (0x300/0x33C/0x340) im IM-Pixelshader (0 = alt: kein Alpha-Test)
fx_alphatest=1
# W98 STARTSEQ-BARS: 1 = (nur Mission, 2 = ueberall) Xbox D3DTSS_ALPHAKILL Stufe 0 (Deferred-TSS 0x21A8DC Bit 2): Texel-Alpha 0 -> discard
# (Status-Check-Balken: Fuellung steckt nur im Alpha), RT-Texturen ausgenommen (0 = alt: ignoriert)
fx_alphakill=1
# W98 STARTSEQ-BARS: 1 = per LockRect gesperrte Texturen einmal je Frame voll hashen, bei Aenderung neu laden
# (Spiel schreibt nach dem Lock ueber den behaltenen Zeiger weiter, z. B. Balken-Fuellung im Atlas), 0 = alt (nur Lock/Stichproben)
tex_lockwatch=1
# DIAG(STARTSEQ-BARS,W98): sbar_diag=1 Stage-0-Texturen der Mission als BMP, =N>1 + Vertex-Dump/Textur-Dumps fuer Draws mit N Vertices;
# sbar_skip_xp=0x.. Draws mit dieser Textur verwerfen; sbar_probe=x1:y1:x2:y2 BB-Pixel je Draw im Zensus-Frame; m3d_census_skip=K erste K Zensus-Draws nicht loggen
sbar_diag=0
sbar_skip_xp=0
sbar_probe=0:0:0:0
m3d_census_skip=0
# W90 FX-ORIG: 1 = Standardpfad (shading=0): Effekt-PS R0=(V0+C0)*T0 -> C0 zur Vertexfarbe addieren (0 = alt: nur V0*T0)
fx_ps_c0=1
# W90 FX-ORIG: 1 = IM-Draws mit Transform-VS lesen UV aus dem oT0-Quellregister (Effekte: v3) (0 = alt: Slot 9, Fallback 2 = Farbe)
fx_im_uv=1
# W133 REM-FX - Effekt-Optionen (Remaster, Standard 0 = Original; ESC-Overlay Seite "Effekte", TAB).
# fx_soft: weiche Partikel - Rauch/Explosionen blenden weich aus, wo sie Gelaende/Gebaeude schneiden
# (Tiefenvergleich mit dem Welt-RT, 0..200 % Reichweite). fx_embers: Glut/Funken bei Explosionen,
# Feuer und Muendungsfeuer (prozedural, 0..200 %). fx_light / fx_light_cockpit: kurzer Licht-Puls
# der Explosionen auf die Welt (Monitorbild) bzw. das Cockpit, 0..200 %. fx_interp=1: 120 FPS -
# Effekt-Partikel mit neuen Positionen je Tick zwischenrechnen (normale statt strenger Sprunggrenze).
fx_soft=0
fx_embers=0
fx_light=0
fx_light_cockpit=0
fx_interp=0
# DIAG(REM-FX,W133): fxr_ab=N Bildpaare an Explosionen (fxab_<k>_a = Original, _b = Option; je Paar
# reihum Soft/Glut/Licht Welt/Licht Cockpit/alle; Zeile "FXR ab #k"), fxr_diag=1 FXR-Zeilen
fxr_ab=0
fxr_diag=0
# W105 MONITOR-FX: Monitor-Effekte des Originals (das Spiel zeichnet sie selbst, BERICHT W105):
# Korn/Scanlines = Rausch-Wash ueber Hauptmonitor/Sub-Monitor/Radar (UVs normiert statt /128),
# Signalstoerung = Zeilen-Zittern bei Treffern/Stoerpegel (Quelle = Kopie des Monitor-RT statt Backbuffer).
# monitor_fx: 1 = Original (Standard), 0 = aus (kein Korn, keine Stoerung), 2 = alter Pfad vor W105 (A/B)
monitor_fx=1
# Staerke 0..100 % (100 = Original): Korn/Scanlines bzw. Signalstoerung (Zeilen-Zittern + Rausch-Spitzen)
monitor_grain=100
monitor_glitch=100
# DIAG(MONITOR-FX,W105): 1 = MFX-Zeilen (Wash-/Zeilen-Draws, Stoerpegel alle 300 Bilder)
mfx_diag=0
# DIAG(MONITOR-FX,W105): 1 = Screenshot-Bild alter Pfad, Partnerbild (+1) neu (Bildpaare aus einem Lauf)
mfx_ab=0
# DIAG(MONITOR-FX,W105): N > 0 = Screenshots in Wash-/Zeilen-Bildern (ohne mfx_ab je 3 Folgebilder, mit mfx_ab Paar alt/neu)
mfx_shots=0
# W121 SHADE-FX - FIX (nur shading=1): 1 = Korn-Wash der Monitore auch im Shading-Pfad mit normierten UVs
# (vorher Texel-Skala 1/128 -> glatter Schleier statt Korn/Scanlines), 0 = alt
shade_mfx=1
# W121 SHADE-FX - Shader-Optionen (Remaster, Standard = Original; ESC-Overlay Seite "Shader", TAB).
# Aussenwelt (nur shading=1): Nebelstaerke 0..100 % (100 Original, 50 reduziert, 0 aus), Kontrast/Gamma
# der Welt-RTs 50..200 % (100 = Original), Schaerfe 0..100 % (kontrastadaptiv, 0 = Original),
# Bloom der Monitor-Komposition 0..200 % (100 = Original)
world_fog=100
world_contrast=100
world_gamma=100
world_sharpen=0
bloom_strength=100
# Cockpit-Licht (Nachbearbeitung des fertigen Bildes, nur Mission, auch shading=0): Leuchten heller
# Lampen/LEDs/Anzeigen 0..100 %, Lichtschein auf die Umgebung 0..100 % (0 = Original), Grundlicht
# unbeleuchteter Flaechen 30..100 % (100 = Original)
cockpit_glow=0
cockpit_spill=0
cockpit_light=100
# W121 Teil 2 - FIX (nur shading=1): 1 = Sichtbarkeitstest (vis_query) nachinstallieren, sobald Shading zur Laufzeit
# (ESC-Menue) eingeschaltet wird. Vorher galt die Sonne dann immer als sichtbar -> Umgebungslicht +0,27 -> Hangar/Welt
# ueberbelichtet (W121_h2). 0 = alt (nur beim Start mit shading=1)
vis_query_live=1
# W121 Teil 2 - FIX: 1 = wechselt shading zur Laufzeit, kleine RTs (beide Kanten <= 64: Bloom-Akkumulatoren 20²/6²)
# leeren - sonst haelt das zeitlich gemischte Bloom den Rest des anderen Pfads (W121_h3: T2 0,225 statt 0). 0 = alt
shade_live_reset=1
# W121 Teil 2 - Shader-Optionen (nur shading=1, Standard = Original): Belichtung der Aussenwelt 25..400 %, Tonemapping
# 0 aus / 1 Reinhard / 2 ACES-aehnlich, Bloom-Schwelle 0..90 %, Licht-Intensitaet Aussenwelt bzw. Cockpit 0..200 %
# (Lichteingaenge V0/V1/C0), Randunschaerfe der Monitor-Komposition 0..100 % (100 = Original, 0 = ueberall scharf)
world_exposure=100
tonemap=0
bloom_threshold=0
light_world=100
light_cockpit=100
world_focus=100
# W131 SHADER-OPT2 - weitere Shader-Optionen (Standard = Original/aus, ESC-Menue Seite "Shader 2"):
# aa_mode: Kantenglaettung 0 aus / 1 FXAA Endbild (Mission) / 2 FXAA Welt-RT (nur shading=1) / 3 beides
# ssao: Umgebungsverdeckung 0..100 % (Bildraum aus der Backbuffer-Tiefe: Cockpit und 3D im BB, nur Mission;
#   wirkt live nur, wenn beim Start ssao>0 oder bb_depth_srv=1 galt). DIAG ssao_view=1 Verdeckung, 2 Tiefe
# color_sat 0..200 % (100), color_temp -100..100 (0, + = waermer), color_lift -50..50 (0),
# color_gamma 50..200 % (100), color_gain 50..200 % (100): Farbabstimmung des Endbilds (nur Mission)
# shadow_soft (nur shading=1;shade_shadow=1): 1 = 3x3-Gauss-PCF (Hypothese NV2A GAUSSIANCUBIC), 0 = 2x2-PCF
# vis_query_async (Leistung, nur mit vis_query): 1 = Sonnentest nutzt das letzte fertige Ergebnis statt zu warten
#   (1 Bild Latenz der Blendung; erstes Ergebnis blockierend wie bisher), 0 = blockierend (bisher). W138: Standard 1
# bb_depth_srv: 1 = Backbuffer-Tiefe immer typlos mit SRV (sonst nur bei ssao>0 beim Start; SSAO live erst nach Neustart)
aa_mode=0
ssao=0
color_sat=100
color_temp=0
color_lift=0
color_gamma=100
color_gain=100
shadow_soft=0
vis_query_async=1
bb_depth_srv=0
# DIAG(SHADE-FX,W121): shfx_ab=1 = Screenshot-Bild mit Original-Werten, Partnerbild (+1) mit den Optionen,
# dazu shot_<f>_fx = dasselbe Bild mit Cockpit-Nachbearbeitung; shot_mission=1 = screenshot_frame zaehlt ab
# Beginn der Kampagnen-Mission (Modus 4); shfx_diag=1 = SHFX-Zeilen alle 600 Missionsbilder.
# shade_ab=3 (+ mfx_ab=1, mfx_shots=N): Paare an Korn-/Stoerzeilen-Bildern, p+1 alter Pfad, p+2 Shading;
# shfx_ab=3 = wie 2 mit der Serie Teil 2 (Belichtung, Tonemapping, Licht, Randunschaerfe, Bloom-Schwelle)
shfx_ab=0
shot_mission=0
shfx_diag=0
